    // 将一张祝福贺卡作为 3D 挂件节点挂到圣诞树上
    function createCardOrnamentNode(card, idx, total, forcedAngle = null) {
      const bottomY = -115;
      const topY = 175;
      const totalH = topY - bottomY;
      // 分布在树身中下至中上部（视觉最显眼、最好点击的位置）
      const t = (forcedAngle !== null)
        ? rand(0.24, 0.72)
        : (0.14 + ((idx + 0.5) / Math.max(1, total)) * 0.70);
      const radius = (1 - t) * 182 + 24;
      const angle = (forcedAngle !== null)
        ? forcedAngle
        : (idx * 2.39996 + 0.35); // 黄金角 360° 均匀错落悬挂

      return {
        type: 'cardOrnament',
        cardId: card.id,
        card,
        x: Math.cos(angle) * radius,
        y: bottomY + t * totalH,
        z: Math.sin(angle) * radius,
        fontSize: card.custom ? 30 : 26,
        colorIdx: idx % 7,
        phase: rand(0, Math.PI * 2),
        hoverScale: 1.0,
        bounce: (forcedAngle !== null) ? 1.0 : 0.0
      };
    }

    function mountAllCardsOnTree() {
      // 清除旧的挂卡节点后重新挂载
      for (let i = treeNodes.length - 1; i >= 0; i--) {
        if (treeNodes[i].type === 'cardOrnament') treeNodes.splice(i, 1);
      }
      // 树上最多同时展示 MAX_TREE_ORNAMENTS 个 3D 挂件以保障 60+ FPS，其余全部保留在「再抽一张」池中
      const visibleCards = allCards.slice(0, MAX_TREE_ORNAMENTS);
      visibleCards.forEach((card, idx) => {
        treeNodes.push(createCardOrnamentNode(card, idx, visibleCards.length));
      });
    }

    // 绑定当前主题对应的预渲染贴图指针，主循环中彻底消除 Map 查找与字符串拼接！
    function bindSpritesForTheme() {
      const theme = THEMES[currentThemeIdx];
      const isPaper = theme.paper;

      for (const n of treeNodes) {
        if (n.type === 'topStar') {
          n.spriteA = getTextSprite('★', theme.starColor, isPaper, 'normal');
          n.spriteB = n.spriteA;
        } else if (n.type === 'trunkText') {
          n.spriteA = getTextSprite(n.text, theme.trunkColor, isPaper, 'trunk');
          n.spriteB = n.spriteA;
        } else if (n.type === 'starHalo') {
          n.spriteA = getTextSprite(n.text, theme.starColor, isPaper, 'normal');
          n.spriteB = getTextSprite(n.altText, theme.starColor, isPaper, 'normal');
        } else if (n.type === 'cardOrnament') {
          const col = n.card.custom
            ? (isPaper ? '#c83e4d' : '#ffe07d')
            : theme.palette[(n.colorIdx + 1) % theme.palette.length];
          n.spriteA = getCardOrnamentSprite(n.card.style || 'gift', col, !!n.card.custom, isPaper);
          n.spriteB = n.spriteA;
        } else {
          const col = theme.palette[n.colorIdx % theme.palette.length];
          n.spriteA = getTextSprite(n.text, col, isPaper, 'normal');
          n.spriteB = getTextSprite(n.altText, col, isPaper, 'normal');
        }
      }

      for (const sp of sparkleNodes) {
        const col = (sp.kind === 'ribbon')
          ? (sp.colorIdx % 3 === 0 ? theme.ribbonColor : theme.palette[sp.colorIdx % theme.palette.length])
          : theme.groundPalette[sp.colorIdx % theme.groundPalette.length];
        sp.sprite = getDotSprite(col, isPaper);
      }

      const snowDot = getDotSprite(theme.snowColor, isPaper);
      for (const s of snowNodes) {
        if (s.isFlake) {
          s.sprite = getTextSprite(s.glyph, theme.snowColor, isPaper, 'normal');
        } else {
          s.dotSprite = snowDot;
        }
      }
    }

    buildKaomojiTree();
    loadCardsFromStorage();
    mountAllCardsOnTree();
    bindSpritesForTheme();
    syncCardsFromCloud();

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        textSpriteCache.clear();
        bindSpritesForTheme();
      });
    }

    // =========================================================================
    // 阶段式启动动效：纯雪开场 -> 文字化粉入地 -> 粒子飞升成树 -> 极简界面浮现
    // =========================================================================
    const prefersReducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const plantPromptEl  = document.getElementById('plantPromptOverlay');
    const plantSentenceEl = document.getElementById('plantSentence');
    const plantInputWrapEl = document.getElementById('plantInputWrap');
    const plantNameInput = document.getElementById('plantNameInput');
    const btnPlantTree   = document.getElementById('btnPlantTree');
    const heroOverlayEl  = document.getElementById('heroOverlay');
    const heroRecipientNameEl = document.getElementById('heroRecipientName');

    // scenePhase: 'prompt' | 'seeding' | 'growing' | 'ready'
    let scenePhase = 'prompt';
    let phaseElapsed = 0;
    let introElapsed = 0;
    let introComplete = false;
    let introStarBurstDone = false;
    let heroRevealed = false;

    const seedParticles = [];
    const risingParticles = [];
    const groundRipples = [];

    let yaw = prefersReducedMotion ? 0.0 : 0.72;
    let pitch = 0.08;
    let velYaw = prefersReducedMotion ? -0.35 : -1.45;
    let velPitch = 0.0;
    let camDist = prefersReducedMotion ? 520 : 680;
    let targetDist = 520;
    let panX = 104;
    let panY = 18;

    let autoRotate = true;
    let autoSpeed = 0.35;
    let sizeMultiplier = 1.05;
    let glowMultiplier = 1.15;

    let pointerDownLeft = false;
    let draggingLeft = false;
    let draggingRight = false;
    let pointerDownX = 0;
    let pointerDownY = 0;
    let lastX = 0;
    let lastY = 0;
    let mouseX = -9999;
    let mouseY = -9999;
    let mouseActive = false;
    let mouseVx = 0;
    let mouseVy = 0;
    let lastMoveX = -9999;
    let lastMoveY = -9999;
    let lastMoveTs = 0;

    function easeOutCubic(x) {
      return 1 - Math.pow(1 - x, 3);
    }

    function easeInCubic(x) {
      return x * x * x;
    }

    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    // 自适应输入框宽度，输入名字时句子始终紧凑居中
    const measureCtx = document.createElement('canvas').getContext('2d');
    function syncPlantInputWidth() {
      if (!plantNameInput) return;
      const val = plantNameInput.value;
      if (!val) {
        plantNameInput.style.width = '78px';
        return;
      }
      const cs = getComputedStyle(plantNameInput);
      measureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      const w = Math.ceil(measureCtx.measureText(val).width);
      plantNameInput.style.width = `${Math.max(78, Math.min(260, w + 26))}px`;
    }

    if (plantInputWrapEl && plantNameInput) {
      plantInputWrapEl.addEventListener('click', () => plantNameInput.focus());
      plantNameInput.addEventListener('input', syncPlantInputWidth);
      plantNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          startPlantingSequence();
        }
      });
      // 页面打开后自动聚焦输入框，方便直接键盘输入
      setTimeout(() => {
        if (scenePhase === 'prompt') plantNameInput.focus({ preventScroll: true });
      }, 120);
    }

    function getTreeViewportLayout() {
      const w = viewW || window.innerWidth || 1280;
      const h = viewH || window.innerHeight || 720;
      const isMobile = w <= 768;
      return {
        isMobile,
        fov: isMobile ? Math.min(w * 1.14, h * 0.60) : Math.min(w, h) * 0.98,
        cx: isMobile ? (w * 0.49 + (panX - 104) * 0.6) : (w * 0.52 + panX),
        cy: isMobile ? (h * 0.62) : (h * 0.49)
      };
    }

    function getTreeGroundScreenPos() {
      const { fov, cx, cy } = getTreeViewportLayout();
      const py = -132 - panY;
      const cosP = Math.cos(pitch), sinP = Math.sin(pitch);
      const depth = py * sinP + camDist;
      const scale = fov / Math.max(40, depth);
      return {
        gx: cx,
        gy: cy - (py * cosP) * scale
      };
    }

    function samplePromptParticles(recipient) {
      seedParticles.length = 0;
      const rowEl = document.getElementById('plantRow');
      const prefixEl = document.getElementById('plantPrefix');
      const suffixEl = document.getElementById('plantSuffix');
      if (!rowEl || !prefixEl || !suffixEl || !plantNameInput || !btnPlantTree) return;

      const { gx, gy } = getTreeGroundScreenPos();
      const rowRect = rowEl.getBoundingClientRect();
      const offW = Math.max(100, Math.ceil(rowRect.width + 20));
      const offH = Math.max(60, Math.ceil(rowRect.height + 20));
      const off = document.createElement('canvas');
      off.width = offW;
      off.height = offH;
      const octx = off.getContext('2d');
      octx.textBaseline = 'middle';
      octx.textAlign = 'center';

      const drawElText = (el, text, color) => {
        const r = el.getBoundingClientRect();
        const cs = getComputedStyle(el);
        octx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        octx.fillStyle = color;
        octx.fillText(text, r.left - rowRect.left + r.width * 0.5, r.top - rowRect.top + r.height * 0.5);
      };

      drawElText(prefixEl, '为', '#f3f5f8');
      if (recipient) {
        drawElText(plantNameInput, recipient, '#e8b86d');
      } else {
        // 未填写名字时将输入框亮线一起化粉
        const ir = plantInputWrapEl.getBoundingClientRect();
        octx.fillStyle = '#e8b86d';
        octx.fillRect(ir.left - rowRect.left + 8, ir.bottom - rowRect.top - 4, Math.max(24, ir.width - 16), 3);
      }
      drawElText(suffixEl, '种下圣诞树', '#f3f5f8');

      // 把「种下」按钮文字与外框微粒化
      const br = btnPlantTree.getBoundingClientRect();
      const bcs = getComputedStyle(btnPlantTree);
      octx.font = `${bcs.fontWeight} ${bcs.fontSize} ${bcs.fontFamily}`;
      octx.fillStyle = '#e8b86d';
      octx.fillText('种下', br.left - rowRect.left + br.width * 0.5, br.top - rowRect.top + br.height * 0.5);

      const img = octx.getImageData(0, 0, offW, offH).data;
      const pts = [];
      const step = 3;
      for (let y = 0; y < offH; y += step) {
        for (let x = 0; x < offW; x += step) {
          const idx = (y * offW + x) * 4;
          const a = img[idx + 3];
          if (a > 75) {
            const isGold = img[idx] > 215 && img[idx + 1] > 160 && img[idx + 2] < 150;
            pts.push({
              sx: rowRect.left + x,
              sy: rowRect.top + y,
              isGold
            });
          }
        }
      }

      // 均匀抽样到约 320 颗，保证全平台丝滑 60fps
      const maxCount = 320;
      const stride = Math.max(1, pts.length / maxCount);
      for (let f = 0; f < pts.length; f += stride) {
        const pt = pts[Math.floor(f)];
        const normX = Math.max(0, Math.min(1, (pt.sx - rowRect.left) / Math.max(1, rowRect.width)));
        const color = pt.isGold ? '#e8b86d' : (Math.random() < 0.35 ? '#ffe7a8' : '#f3f5f8');
        seedParticles.push({
          x: pt.sx,
          y: pt.sy,
          startX: pt.sx,
          startY: pt.sy,
          driftX: rand(-36, 36),
          driftY: rand(-38, 12),
          ctrlOffsetX: rand(-90, 90),
          targetX: gx + rand(-34, 34),
          targetY: gy + rand(-8, 10),
          delay: normX * 0.16 + rand(0, 0.06),
          dur: rand(0.56, 0.74),
          size: rand(3.2, 6.2),
          sprite: getDotSprite(color, false),
          buried: false,
          alpha: 1
        });
      }
    }

    function spawnRisingSpiritParticles() {
      risingParticles.length = 0;
      const theme = THEMES[currentThemeIdx];
      const total = 150;
      for (let i = 0; i < total; i++) {
        const branch = (i % 2 === 0) ? 0 : Math.PI;
        const col = (i % 4 === 0) ? theme.starColor : theme.palette[i % theme.palette.length];
        risingParticles.push({
          branch,
          angleOffset: rand(-0.35, 0.35),
          delay: (i / total) * 0.62 + rand(0, 0.08),
          dur: rand(0.82, 1.15),
          size: rand(4.0, 8.2),
          radialJitter: rand(-14, 14),
          sprite: getDotSprite(col, false)
        });
      }
    }

    function startPlantingSequence() {
      if (scenePhase !== 'prompt') return;
      const recipient = (plantNameInput ? plantNameInput.value : '').trim();
      if (heroRecipientNameEl) {
        heroRecipientNameEl.textContent = recipient || 'you';
      }

      if (prefersReducedMotion) {
        if (plantPromptEl) plantPromptEl.remove();
        introComplete = true;
        introStarBurstDone = true;
        scenePhase = 'ready';
        if (heroOverlayEl && !heroRevealed) {
          heroRevealed = true;
          heroOverlayEl.classList.add('is-revealed');
        }
        return;
      }

      if (btnPlantTree) {
        const br = btnPlantTree.getBoundingClientRect();
        spawnIntroStarBurst(br.left + br.width * 0.5, br.top + br.height * 0.5);
      }
      samplePromptParticles(recipient);
      if (plantPromptEl) {
        plantPromptEl.classList.add('is-dissolved');
        plantPromptEl.style.pointerEvents = 'none';
        setTimeout(() => { if (plantPromptEl && plantPromptEl.parentNode) plantPromptEl.remove(); }, 260);
      }

      scenePhase = 'seeding';
      phaseElapsed = 0;
      groundRipples.length = 0;
    }

    if (btnPlantTree) {
      btnPlantTree.addEventListener('click', startPlantingSequence);
    }

    function spawnIntroStarBurst(sx, sy) {
      const theme = THEMES[currentThemeIdx];
      const count = 14;
      for (let i = 0; i < count; i++) {
        const ang = (i / count) * Math.PI * 2 + rand(-0.18, 0.18);
        const spd = rand(65, 165);
        const shp = (i % 2 === 0) ? 'spark' : 'star';
        const col = (i % 3 === 0) ? theme.starColor : theme.palette[i % theme.palette.length];
        burstEffects.push({
          x: sx,
          y: sy,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 24,
          gravity: 55,
          drag: 0.96,
          rot: rand(-0.4, 0.4),
          vrot: rand(-2.2, 2.2),
          swayAmp: 0,
          phase: rand(0, Math.PI * 2),
          sprite: getVectorBurstSprite(shp, col, theme.paper),
          life: 1.0,
          decay: rand(0.95, 1.35),
          size: rand(14, 22)
        });
      }
    }

    function spawnBurst(sx, sy) {
      const theme = THEMES[currentThemeIdx];
      const cfg = THEME_BURSTS[currentThemeIdx];

      if (cfg.mode === 'xmas') {
        // 🎄 风格1：简约手绘线条圣诞元素（礼物盒、铃铛、圣诞帽、拐杖糖、小树、星芒）
        const count = 15;
        for (let i = 0; i < count; i++) {
          const ang = (i / count) * Math.PI * 2 + rand(-0.22, 0.22);
          const spd = rand(85, 230);
          const shp = cfg.shapes[Math.floor(Math.random() * cfg.shapes.length)];
          const col = theme.palette[i % theme.palette.length];
          burstEffects.push({
            x: sx, y: sy,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 95,
            gravity: 260,
            drag: 0.99,
            rot: rand(-0.3, 0.3),
            vrot: rand(-2.8, 2.8),
            swayAmp: 0,
            phase: rand(0, Math.PI * 2),
            sprite: getVectorBurstSprite(shp, col, false),
            life: 1.0,
            decay: rand(0.68, 1.02),
            size: rand(22, 32)
          });
        }
      } else if (cfg.mode === 'formula') {
        // 📖 风格2：数理化公式从纸页间飘散绽放（简约钢笔手写墨水色）
        const inkPalette = ['#23201d', '#b8323e', '#1f6b48', '#274c77', '#9c5a14'];
        const count = 11;
        for (let i = 0; i < count; i++) {
          const ang = (i / count) * Math.PI * 2 + rand(-0.25, 0.25);
          const spd = rand(75, 195);
          const txt = cfg.items[Math.floor(Math.random() * cfg.items.length)];
          const col = inkPalette[i % inkPalette.length];
          burstEffects.push({
            x: sx, y: sy,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 45,
            gravity: 42,
            drag: 0.96,
            rot: rand(-0.22, 0.22),
            vrot: rand(-0.55, 0.55),
            swayAmp: 12,
            phase: rand(0, Math.PI * 2),
            sprite: getTextSprite(txt, col, true, 'formula'),
            life: 1.0,
            decay: rand(0.55, 0.85),
            size: rand(16, 22)
          });
        }
      } else if (cfg.mode === 'heart') {
        // 🌸 风格3：极简粉金手绘线条爱心（空心/实心/双层套心/微星心，浪漫浮空上升）
        const heartColors = ['#ff85b3', '#ffb3d1', '#ffe08a', '#ff5c93', '#ffd6e8', '#e0aaff'];
        const count = 16;
        for (let i = 0; i < count; i++) {
          const ang = rand(-Math.PI, 0) + rand(-0.4, 0.4);
          const spd = rand(50, 160);
          const shp = cfg.shapes[Math.floor(Math.random() * cfg.shapes.length)];
          const col = heartColors[i % heartColors.length];
          burstEffects.push({
            x: sx + rand(-10, 10), y: sy + rand(-10, 10),
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 55,
            gravity: -95,
            drag: 0.965,
            rot: rand(-0.28, 0.28),
            vrot: rand(-0.9, 0.9),
            swayAmp: rand(35, 72),
            phase: rand(0, Math.PI * 2),
            sprite: getVectorBurstSprite(shp, col, false),
            life: 1.0,
            decay: rand(0.55, 0.88),
            size: rand(20, 32)
          });
        }
      } else {
        // 🌌 风格4：极简几何线条冰晶雪花（六角树枝/六边形冰晶/星晶针，旋转飘落）
        const snowColors = ['#e0f7ff', '#67e8f9', '#a5b4fc', '#c084fc', '#ffffff', '#5eead4'];
        const count = 18;
        for (let i = 0; i < count; i++) {
          const ang = (i / count) * Math.PI * 2 + rand(-0.15, 0.15);
          const spd = rand(80, 215);
          const shp = cfg.shapes[Math.floor(Math.random() * cfg.shapes.length)];
          const col = snowColors[i % snowColors.length];
          burstEffects.push({
            x: sx, y: sy,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            gravity: 52,
            drag: 0.935,
            rot: rand(0, Math.PI * 2),
            vrot: rand(-4.2, 4.2),
            swayAmp: rand(15, 32),
            phase: rand(0, Math.PI * 2),
            sprite: getVectorBurstSprite(shp, col, false),
            life: 1.0,
            decay: rand(0.52, 0.84),
            size: rand(20, 32)
          });
        }
      }

      for (const n of treeNodes) {
        if (n.type === 'kaomoji' && Math.random() < 0.35) {
          n.bounce = 1.0;
          n.blinking = true;
          n.blinkTimer = 0.45;
        }
      }

    // =========================================================================
    // 3D 信封祝福贺卡弹窗 & 手写挂卡交互控制器（支持空间坐标弹出、3D 翻盖拆封、抽信换卡、轻盈退场）
    // =========================================================================
    const cardModalBackdrop    = document.getElementById('cardModalBackdrop');
    const composeModalBackdrop = document.getElementById('composeModalBackdrop');
    const envelopeShell        = document.getElementById('envelopeShell');
    const envWaxSeal           = document.getElementById('envWaxSeal');
    const cardTagPill          = document.getElementById('cardTagPill');
    const cardStyleLabel       = document.getElementById('cardStyleLabel');
    const cardKaomojiDisplay   = document.getElementById('cardKaomojiDisplay');
    const cardTitleDisplay     = document.getElementById('cardTitleDisplay');
    const cardBodyDisplay      = document.getElementById('cardBodyDisplay');
    const cardSignDisplay      = document.getElementById('cardSignDisplay');
    const btnDeleteCard        = document.getElementById('btnDeleteCard');
    const toastEl              = document.getElementById('toastMsg');

    const WAX_SEAL_GLYPHS = {
      gift: '✦',
      heart: '♥',
      star: '★',
      snow: '❄'
    };

    let currentOpenedCard = null;
    let lastRandomCardId = null;
    let selectedComposeKaomoji = '(=^•ω•^=) ♡';
    let selectedComposeStyle = 'gift';
    let toastTimer = null;
    let openFlapTimer = null;
    let swapLetterTimer = null;
    let closeModalTimer = null;

    function clearModalTimers() {
      clearTimeout(openFlapTimer);
      clearTimeout(swapLetterTimer);
      clearTimeout(closeModalTimer);
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
    }

    function fillCardContent(card, fromHangingCard) {
      currentOpenedCard = card;
      lastRandomCardId = card.id;
      const idx = allCards.findIndex((c) => c.id === card.id);
      const numStr = String(idx + 1).padStart(2, '0');
      const canDelete = Boolean(card.custom && (!isCloudEnabled || card.mine));

      cardTagPill.textContent = card.mine
        ? `我的手写贺卡 · No.${numStr}`
        : (card.custom
          ? `共享树来信 · No.${numStr}`
          : (fromHangingCard ? `树上挂卡 · No.${numStr}` : `随机盲盒 · No.${numStr}`));
      cardStyleLabel.textContent = CARD_STYLE_NAMES[card.style] || '圣诞祝福卡';
      envWaxSeal.textContent = WAX_SEAL_GLYPHS[card.style] || '★';
      cardKaomojiDisplay.textContent = card.kaomoji || '(=^•ω•^=) ♡';
      cardTitleDisplay.textContent = card.title || '圣诞快乐';
      cardBodyDisplay.textContent = card.message;
      cardSignDisplay.textContent = `—— ${card.sign || '匿名圣诞老人'}`;
      btnDeleteCard.style.display = canDelete ? 'inline-block' : 'none';
    }

    // 带空间发射起点 (originX, originY) 的 3D 信封弹出与拆封编排
    function openCardModal(card, fromHangingCard = false, originX = null, originY = null) {
      if (!card) return;
      clearModalTimers();
      fillCardContent(card, fromHangingCard);

      // 计算点击位置相对屏幕中心的偏移量（遵循 1/3 屏运动距离法则，防止跨屏飞跃失焦）
      const maxDx = Math.min(260, viewW * 0.28);
      const maxDy = Math.min(200, viewH * 0.28);
      const dx = originX !== null ? Math.max(-maxDx, Math.min(maxDx, originX - viewW * 0.5)) : 0;
      const dy = originY !== null ? Math.max(-maxDy, Math.min(maxDy, originY - viewH * 0.5)) : 28;
      const tilt = Math.max(-10, Math.min(10, dx * -0.032));

      envelopeShell.style.setProperty('--origin-x', `${dx.toFixed(1)}px`);
      envelopeShell.style.setProperty('--origin-y', `${dy.toFixed(1)}px`);
      envelopeShell.style.setProperty('--origin-rot', `${tilt.toFixed(1)}deg`);

      composeModalBackdrop.classList.remove('open', 'closing');
      cardModalBackdrop.classList.remove('closing');

      // 复位信封到合拢待发射状态
      envelopeShell.classList.remove('is-entering', 'is-opened', 'is-swapping');
      cardModalBackdrop.classList.add('open');
      void envelopeShell.offsetWidth; // 强制同步初始空间起点帧

      // Beat 1 (0ms): 信封从点击处弹簧飞出至画面中央
      requestAnimationFrame(() => {
        envelopeShell.classList.add('is-entering');
      });

      // Beat 2 (200ms): 到达落点后，火漆印章解封 -> 3D 翻盖向上折开 -> 祝福信纸抽出并错峰显现
      openFlapTimer = setTimeout(() => {
        envelopeShell.classList.add('is-opened');
      }, 200);
    }

    function pickRandomCard() {
      if (!allCards.length) return null;
      let pool = allCards;
      if (allCards.length > 1 && lastRandomCardId) {
        pool = allCards.filter((c) => c.id !== lastRandomCardId);
      }
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function openRandomCard(originX = null, originY = null) {
      const picked = pickRandomCard();
      if (picked) openCardModal(picked, false, originX, originY);
    }

    // 在信封已打开状态下点击「再抽一张」：信纸缩回袋中 -> 替换新信 -> 轻快滑出
    function swapToRandomCard() {
      const picked = pickRandomCard();
      if (!picked) return;
      clearTimeout(swapLetterTimer);
      envelopeShell.classList.add('is-swapping');
      swapLetterTimer = setTimeout(() => {
        fillCardContent(picked, false);
        void envelopeShell.offsetWidth;
        envelopeShell.classList.remove('is-swapping');
      }, 175);
    }

    function openComposeModal() {
      clearModalTimers();
      cardModalBackdrop.classList.remove('open', 'closing');
      envelopeShell.classList.remove('is-entering', 'is-opened', 'is-swapping');
      composeModalBackdrop.classList.remove('closing');
      composeModalBackdrop.classList.add('open');
      setTimeout(() => document.getElementById('inputCardMsg').focus(), 100);
    }

    // 轻盈退场（鼠标点击退场保留 190ms 柔和离场；键盘 Esc 则瞬间响应不拖沓）
    function closeAllModals(instant = false) {
      clearModalTimers();
      const anyOpen = cardModalBackdrop.classList.contains('open') || composeModalBackdrop.classList.contains('open');
      if (!anyOpen) return;

      if (instant) {
        cardModalBackdrop.classList.remove('open', 'closing');
        composeModalBackdrop.classList.remove('open', 'closing');
        envelopeShell.classList.remove('is-entering', 'is-opened', 'is-swapping');
        return;
      }

      if (cardModalBackdrop.classList.contains('open')) cardModalBackdrop.classList.add('closing');
      if (composeModalBackdrop.classList.contains('open')) composeModalBackdrop.classList.add('closing');

      closeModalTimer = setTimeout(() => {
        cardModalBackdrop.classList.remove('open', 'closing');
        composeModalBackdrop.classList.remove('open', 'closing');
        envelopeShell.classList.remove('is-entering', 'is-opened', 'is-swapping');
      }, 195);
    }

    // 点击圣诞树画布时的智能判定：
    // 1. 始终触发当前主题极简点击粒子
    // 2. 点到树上悬挂的具体贺卡 -> 信封从该挂卡 3D 位置弹出并拆开
    // 3. 点到圣诞树任意部位 -> 随机抽一张信封从点击点弹出并拆开
    // 4. 点到空白星空 -> 仅展示粒子特效，不弹弹窗
    function handleCanvasClick(sx, sy) {
      if (scenePhase !== 'ready') return;
      spawnBurst(sx, sy);

      // 优先从前景到背景检测是否点中了树上挂着的贺卡
      for (let i = renderQueue.length - 1; i >= 0; i--) {
        const item = renderQueue[i];
        if (item.node.type !== 'cardOrnament') continue;
        const hitR = Math.max(22, Math.min(44, 28 * item.scale * sizeMultiplier));
        const dist = Math.hypot(sx - item.sx, sy - item.sy);
        if (dist <= hitR) {
          item.node.bounce = 1.0;
          openCardModal(item.node.card, true, item.sx, item.sy);
          return;
        }
      }

      // 其次检测是否点中了圣诞树本体任意部位（点随机部位出随机信封贺卡）
      for (let i = renderQueue.length - 1; i >= 0; i--) {
        const item = renderQueue[i];
        const t = item.node.type;
        if (t !== 'kaomoji' && t !== 'topStar' && t !== 'trunkText') continue;
        const hitR = Math.max(28, Math.min(54, 38 * item.scale * sizeMultiplier));
        const dist = Math.hypot(sx - item.sx, sy - item.sy);
        if (dist <= hitR) {
          openRandomCard(sx, sy);
          return;
        }
      }
    }

    // 绑定弹窗与手写表单按钮
    document.getElementById('btnWriteCard').addEventListener('click', openComposeModal);
    document.getElementById('btnOpenComposeFromCard').addEventListener('click', openComposeModal);
    document.getElementById('btnRandomAnother').addEventListener('click', swapToRandomCard);
    document.getElementById('btnCloseCardModal').addEventListener('click', () => closeAllModals(false));
    document.getElementById('btnCloseComposeModal').addEventListener('click', () => closeAllModals(false));
    document.getElementById('btnCancelCompose').addEventListener('click', () => closeAllModals(false));

    cardModalBackdrop.addEventListener('click', (e) => {
      if (e.target === cardModalBackdrop) closeAllModals(false);
    });
    composeModalBackdrop.addEventListener('click', (e) => {
      if (e.target === composeModalBackdrop) closeAllModals(false);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAllModals(true);
    });

    // 摘下自己写的贺卡
    btnDeleteCard.addEventListener('click', async () => {
      if (!currentOpenedCard || !currentOpenedCard.custom) return;
      const targetId = currentOpenedCard.id;

      if (isCloudEnabled) {
        btnDeleteCard.disabled = true;
        try {
          const res = await fetch(`${apiBase}/api/cards/${encodeURIComponent(targetId)}`, {
            method: 'DELETE',

          });
          const data = await res.json().catch(() => ({}));

    // 颜文字印章 & 卡片样式选择器
    document.querySelectorAll('#kaomojiPicker .picker-chip').forEach((chip) => {

    document.querySelectorAll('#cardStylePicker .picker-chip').forEach((chip) => {

    // 提交手写贺卡并直接挂到当前面向观众的圣诞树正面！
    const btnSubmitCard = document.getElementById('btnSubmitCard');
    btnSubmitCard.addEventListener('click', async () => {

      // 计算当前正朝向屏幕前方的树身角度，让新挂上去的贺卡第一时间闪亮出现在你眼前
      const frontAngle = -yaw - Math.PI * 0.5 + rand(-0.35, 0.35);
      const newNode = createCardOrnamentNode(newCard, 0, allCards.length, frontAngle);
      treeNodes.push(newNode);

      titleEl.value = '';

      closeAllModals();

      // 在树身视觉中心处燃放庆祝粒子并弹出提示
      const burstLayout = getTreeViewportLayout();
      spawnBurst(burstLayout.cx, burstLayout.cy);
      showToast(isCloudEnabled
        ? '已挂上共享圣诞树，来访的人都能看到'
        : '已挂上圣诞树');
    });

    canvas.addEventListener('mousedown', (e) => {
      if (scenePhase !== 'ready') return;
      if (e.button === 0) {
        pointerDownLeft = true;
        draggingLeft = false;
      }
      if (e.button === 2) draggingRight = true;
      pointerDownX = lastX = e.clientX;
      pointerDownY = lastY = e.clientY;
    });

    window.addEventListener('mouseup', (e) => {
      if (pointerDownLeft && !draggingLeft) {
        handleCanvasClick(e.clientX, e.clientY);
      }
      pointerDownLeft = false;
      draggingLeft = false;
      draggingRight = false;
    });

    window.addEventListener('mousemove', (e) => {
      const nowMs = performance.now();
      if (mouseActive && lastMoveTs > 0) {
        const moveDt = Math.max(0.008, (nowMs - lastMoveTs) * 0.001);
        const rawVx = (e.clientX - lastMoveX) / moveDt;
        const rawVy = (e.clientY - lastMoveY) / moveDt;
        mouseVx = Math.max(-1400, Math.min(1400, mouseVx * 0.45 + rawVx * 0.55));
        mouseVy = Math.max(-1400, Math.min(1400, mouseVy * 0.45 + rawVy * 0.55));
      }
      lastMoveX = mouseX = e.clientX;
      lastMoveY = mouseY = e.clientY;
      lastMoveTs = nowMs;
      mouseActive = true;
      if (!pointerDownLeft && !draggingRight) return;

      if (pointerDownLeft && !draggingLeft) {
        if (Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY) < 5) {
          return;
        }
        draggingLeft = true;
        lastX = e.clientX;
        lastY = e.clientY;
        return;
      }

      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      if (draggingLeft) {
        const sens = 0.0068;
        yaw += dx * sens;
        pitch = Math.max(-0.55, Math.min(1.15, pitch + dy * sens));
        velYaw = dx * 0.28;
        velPitch = dy * 0.25;
      } else if (draggingRight) {
        panX += dx * 0.8;
        panY += dy * 0.55;
      }
    });

    document.documentElement.addEventListener('mouseleave', () => {
      mouseActive = false;
    });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      targetDist = Math.max(230, Math.min(920, targetDist + e.deltaY * 0.32));
    }, { passive: false });

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        const t = e.touches[0];
        lastMoveX = mouseX = t.clientX;
        lastMoveY = mouseY = t.clientY;
        lastMoveTs = performance.now();
        mouseActive = true;
        if (scenePhase !== 'ready') return;
        pointerDownLeft = true;
        draggingLeft = false;
        pointerDownX = lastX = t.clientX;
        pointerDownY = lastY = t.clientY;
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      mouseActive = false;
      if (pointerDownLeft && !draggingLeft) {
        handleCanvasClick(pointerDownX, pointerDownY);
      }
      pointerDownLeft = false;
      draggingLeft = false;
    });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      const tx = t.clientX;
      const ty = t.clientY;
      const nowMs = performance.now();
      if (mouseActive && lastMoveTs > 0) {
        const moveDt = Math.max(0.008, (nowMs - lastMoveTs) * 0.001);
        const rawVx = (tx - lastMoveX) / moveDt;
        const rawVy = (ty - lastMoveY) / moveDt;
        mouseVx = Math.max(-1400, Math.min(1400, mouseVx * 0.45 + rawVx * 0.55));
        mouseVy = Math.max(-1400, Math.min(1400, mouseVy * 0.45 + rawVy * 0.55));
      }
      lastMoveX = mouseX = tx;
      lastMoveY = mouseY = ty;
      lastMoveTs = nowMs;
      mouseActive = true;

      if (!pointerDownLeft || scenePhase !== 'ready') return;
      if (!draggingLeft) {
        if (Math.hypot(tx - pointerDownX, ty - pointerDownY) < 5) return;
        draggingLeft = true;
        lastX = tx;
        lastY = ty;
        return;
      }
      const dx = tx - lastX;
      const dy = ty - lastY;
      lastX = tx;
      lastY = ty;
      yaw += dx * 0.0068;
      pitch = Math.max(-0.55, Math.min(1.15, pitch + dy * 0.0068));
      velYaw = dx * 0.25;
      velPitch = dy * 0.25;
    }, { passive: true });

    // =========================================================================
    // 超高速 drawImage 3D 渲染主循环
    // =========================================================================
    let viewW = 0;
    let viewH = 0;
    let dpr = 1;

    function resizeCanvas() {
      const w = window.innerWidth || document.documentElement.clientWidth || 1280;
      const h = window.innerHeight || document.documentElement.clientHeight || 720;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (w === viewW && h === viewH && canvas.width === Math.floor(w * dpr)) return;
      viewW = w;
      viewH = h;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      rebuildBackgroundCache(viewW, viewH);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const renderQueue = [];
    let prevTime = performance.now();

    let firstSnowTime = 0;

    function renderBurstEffects(dt, timeSec) {
      if (!burstEffects.length) return;
      ctx.globalCompositeOperation = 'source-over';
      for (let i = burstEffects.length - 1; i >= 0; i--) {
        const b = burstEffects[i];
        b.life -= dt * b.decay;
        if (b.life <= 0) {
          burstEffects.splice(i, 1);
          continue;
        }
        const damp = Math.pow(b.drag, dt * 60);
        b.vx *= damp;
        b.vy *= damp;
        b.vy += b.gravity * dt;
        const swayX = b.swayAmp ? Math.sin(timeSec * 5.2 + b.phase) * b.swayAmp * dt : 0;
        b.x += b.vx * dt + swayX;
        b.y += b.vy * dt;
        b.rot += b.vrot * dt;

        const scalePop = (b.life > 0.85) ? (1.0 - (b.life - 0.85) * 3.0) : (0.65 + 0.35 * b.life);
        const ratio = (b.size * Math.max(0.25, scalePop)) / b.sprite.baseFontPx;
        const dw = b.sprite.w * ratio;
        const dh = b.sprite.h * ratio;

        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, b.life * 1.25));
        ctx.translate(b.x, b.y);
        if (b.rot !== 0) ctx.rotate(b.rot);
        ctx.drawImage(b.sprite.canvas, -dw * 0.5, -dh * 0.5, dw, dh);
        ctx.restore();
      }
    }

    function animate(now) {
      resizeCanvas();
      const dt = Math.min(0.05, (now - prevTime) * 0.001);
      prevTime = now;
      const timeSec = now * 0.001;
      if (!firstSnowTime) firstSnowTime = timeSec;

      if (scenePhase === 'seeding') {
        phaseElapsed += dt;
      } else if (scenePhase === 'growing') {
        introElapsed += dt;
        if (!heroRevealed && introElapsed >= 1.48) {
          heroRevealed = true;
          if (heroOverlayEl) heroOverlayEl.classList.add('is-revealed');
        }
        if (introElapsed >= 2.08) {
          introComplete = true;
          scenePhase = 'ready';
          seedParticles.length = 0;
          risingParticles.length = 0;
          groundRipples.length = 0;
        }
      }

      if (scenePhase === 'growing' || scenePhase === 'ready') {
        if (!draggingLeft) {
          if (autoRotate) {
            velYaw += (-autoSpeed - velYaw) * Math.min(1, dt * (introComplete ? 2.4 : 2.1));
          } else {
            velYaw *= Math.pow(0.05, dt);
          }
          velPitch *= Math.pow(0.05, dt);
          yaw += velYaw * dt;
          pitch = Math.max(-0.55, Math.min(1.15, pitch + velPitch * dt));
        }
        camDist += (targetDist - camDist) * Math.min(1, dt * (introComplete ? 9.5 : 3.4));
      }

      const theme = THEMES[currentThemeIdx];
      const isPaper = theme.paper;

      // 0. 一次性拷贝离屏背景缓存（极速清屏）
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.drawImage(bgCanvas, 0, 0, viewW, viewH);

      const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
      const cosP = Math.cos(pitch), sinP = Math.sin(pitch);
      const { fov, cx, cy } = getTreeViewportLayout();
      const snowOpenAlpha = easeOutCubic(Math.min(1, (timeSec - firstSnowTime) / 0.75));
      mouseVx *= Math.pow(0.03, dt);
      mouseVy *= Math.pow(0.03, dt);
      const mSpd = Math.hypot(mouseVx, mouseVy);
      const hasMoveDir = mSpd > 28;
      const mxDir = hasMoveDir ? (mouseVx / mSpd) : 0;
      const myDir = hasMoveDir ? (mouseVy / mSpd) : 0;
      const mPerpX = -myDir;
      const mPerpY = mxDir;

      // 1. 绘制漫天强化 3D 飘雪（发光雪尘 + 立体雪花符号，含鼠标划过向两侧散开物理）
      if (!isPaper) ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < snowNodes.length; i++) {
        const s = snowNodes[i];
        s.y += s.vy * dt;
        s.x += (s.vx + Math.sin(timeSec * 1.15 + s.phase) * s.swayAmp) * dt;
        if (s.y < -300) {
          s.y = 360;
          s.x = rand(-540, 540);
          s.z = rand(-480, 480);
          s.pushX = s.pushY = s.pushVx = s.pushVy = 0;
        }
        if (s.x < -580) s.x = 580;
        if (s.x > 580) s.x = -580;

        const py = s.y - panY;
        const rx = s.x * cosY - s.z * sinY;
        const rz1 = s.x * sinY + s.z * cosY;
        const depth = py * sinP + rz1 * cosP + camDist;
        if (depth <= 25) continue;

        const scale = fov / depth;
        const sx = cx + rx * scale;
        const sy = cy - (py * cosP - rz1 * sinP) * scale;

        if (!prefersReducedMotion && mouseActive) {
          const curX = sx + s.pushX;
          const curY = sy + s.pushY;
          const dx = curX - mouseX;
          const dy = curY - mouseY;
          const dist = Math.hypot(dx, dy);
          const repelR = 132;
          if (dist < repelR) {
            const strength = 1 - dist / repelR;
            const rxNorm = dist > 1.5 ? (dx / dist) : ((i % 2 === 0) ? 1 : -1);
            const ryNorm = dist > 1.5 ? (dy / dist) : -0.25;
            let partX = rxNorm >= 0 ? 1 : -1;
            let partY = ryNorm * 0.35;
            if (hasMoveDir) {
              const sideSign = (dx * mPerpX + dy * mPerpY) >= 0 ? 1 : -1;
              partX = mPerpX * sideSign;
              partY = mPerpY * sideSign;
            }
            const force = 2900 * strength * strength;
            s.pushVx += (rxNorm * 0.65 + partX * 0.85) * force * dt;
            s.pushVy += (ryNorm * 0.65 + partY * 0.75) * force * dt;
          }
        }

        // 弹簧阻尼恢复：让被推开的雪花轻柔回落回原本雪幕
        s.pushVx += (-s.pushX * 2.1 - s.pushVx * 3.6) * dt;
        s.pushVy += (-s.pushY * 2.1 - s.pushVy * 3.6) * dt;
        s.pushX += s.pushVx * dt;
        s.pushY += s.pushVy * dt;
        const pushMag = Math.hypot(s.pushX, s.pushY);
        if (pushMag > 175) {
          const clampScale = 175 / pushMag;
          s.pushX *= clampScale;
          s.pushY *= clampScale;
        }

        const drawSnowX = sx + s.pushX;
        const drawSnowY = sy + s.pushY;
        const energyBoost = pushMag > 2 ? (1 + Math.min(0.28, pushMag * 0.0035)) : 1;
        const twinkle = 0.72 + 0.28 * Math.sin(timeSec * 3.2 + s.phase);
        ctx.globalAlpha = Math.min(1, Math.max(0.18, Math.min(1.0, (460 / depth) * s.alphaBase * twinkle)) * (isPaper ? 0.68 : 0.96) * snowOpenAlpha * energyBoost);

        if (s.isFlake) {
          const ratio = (s.size * scale * 0.62) / s.sprite.baseFontPx;
          const dw = s.sprite.w * ratio;
          const dh = s.sprite.h * ratio;
          ctx.drawImage(s.sprite.canvas, drawSnowX - dw * 0.5, drawSnowY - dh * 0.5, dw, dh);
        } else {
          const diam = Math.max(3.2, s.size * scale * 0.92 * glowMultiplier);
          ctx.drawImage(s.dotSprite, drawSnowX - diam * 0.5, drawSnowY - diam * 0.5, diam, diam);
        }
      }

      // 纯雪开场提示阶段：仅渲染飘雪星空
      if (scenePhase === 'prompt') {
        ctx.globalCompositeOperation = 'source-over';
        canvas.style.cursor = 'default';
        requestAnimationFrame(animate);
        return;
      }

      // 1.5 阶段 A/B 衔接：文字化为粒子钻入地面 + 地面入土光晕涟漪
      if (scenePhase === 'seeding' || groundRipples.length > 0) {
        if (!isPaper) ctx.globalCompositeOperation = 'lighter';
        const { gx, gy } = getTreeGroundScreenPos();
        let buriedNow = 0;

        for (let i = 0; i < seedParticles.length; i++) {
          const p = seedParticles[i];
          if (p.buried) {
            buriedNow++;
            continue;
          }
          const localT = phaseElapsed - p.delay;
          if (localT < 0) {
            ctx.globalAlpha = 0.92;
            const d = p.size * 1.1;
            ctx.drawImage(p.sprite, p.startX - d * 0.5, p.startY - d * 0.5, d, d);
            continue;
          }
          const burstEnd = 0.16;
          const bx = p.startX + p.driftX;
          const by = p.startY + p.driftY;
          if (localT < burstEnd) {
            const u = easeOutCubic(localT / burstEnd);
            p.x = p.startX + p.driftX * u;
            p.y = p.startY + p.driftY * u;
            p.alpha = 1;
          } else {
            const diveT = Math.min(1, (localT - burstEnd) / p.dur);
            const e = easeInCubic(diveT) * 0.65 + diveT * 0.35;
            const inv = 1 - e;
            const ctrlX = (bx + p.targetX) * 0.5 + p.ctrlOffsetX;
            const ctrlY = Math.min(by, p.targetY) + Math.abs(p.targetY - by) * 0.35;
            p.x = inv * inv * bx + 2 * inv * e * ctrlX + e * e * p.targetX;
            p.y = inv * inv * by + 2 * inv * e * ctrlY + e * e * p.targetY;
            p.alpha = diveT > 0.82 ? Math.max(0, 1 - (diveT - 0.82) / 0.18) : 1;
            if (diveT >= 1) {
              p.buried = true;
              buriedNow++;
              if (groundRipples.length < 48 && Math.random() < 0.24) {
                groundRipples.push({
                  x: p.targetX,
                  y: p.targetY,
                  r: 3,
                  maxR: rand(26, 68),
                  life: 1.0,
                  decay: rand(1.15, 1.85)
                });
              }
              continue;
            }
          }
          ctx.globalAlpha = p.alpha * 0.96;
          const d = p.size * 1.8;
          ctx.drawImage(p.sprite, p.x - d * 0.5, p.y - d * 0.5, d, d);
        }

        // 地面汇入光斑随落土粒子逐渐亮起，并在成长阶段渐隐
        const buryRatio = seedParticles.length ? (buriedNow / seedParticles.length) : 1;
        const glowFade = (scenePhase === 'seeding')
          ? buryRatio
          : Math.max(0, 1 - introElapsed / 0.75);
        if (glowFade > 0.01) {
          const seedSprite = getDotSprite('#e8b86d', false);
          ctx.globalAlpha = 0.72 * glowFade;
          ctx.drawImage(seedSprite, gx - 90, gy - 32, 180, 64);
        }

        for (let i = groundRipples.length - 1; i >= 0; i--) {
          const rp = groundRipples[i];
          rp.life -= dt * rp.decay;
          if (rp.life <= 0) {
            groundRipples.splice(i, 1);
            continue;
          }
          const radius = rp.r + (rp.maxR - rp.r) * easeOutCubic(1 - rp.life);
          ctx.save();
          ctx.globalAlpha = rp.life * 0.55;
          ctx.strokeStyle = '#ffd98a';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.ellipse(rp.x, rp.y, radius, radius * 0.34, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        if (scenePhase === 'seeding' && (phaseElapsed >= 0.94 || (seedParticles.length > 0 && buriedNow === seedParticles.length && phaseElapsed >= 0.76))) {
          scenePhase = 'growing';
          introElapsed = 0;
          introComplete = false;
          introStarBurstDone = false;
          spawnRisingSpiritParticles();
        }

        if (scenePhase === 'seeding') {
          renderBurstEffects(dt, timeSec);
          ctx.globalCompositeOperation = 'source-over';
          canvas.style.cursor = 'default';
          requestAnimationFrame(animate);
          return;
        }
      }

      // 2. 绘制螺旋流光星尘与底部星环（全贴图 drawImage + 发光叠加）
      if (!isPaper) ctx.globalCompositeOperation = 'lighter';
      const gRot = -timeSec * 0.14;
      const cg = Math.cos(gRot), sg = Math.sin(gRot);

      for (let i = 0; i < sparkleNodes.length; i++) {
        const sp = sparkleNodes[i];
        let spIntroAlpha = 1;
        let spIntroScale = 1;
        if (!introComplete) {
          const spStart = sp.kind === 'ground' ? 0.02 : (0.10 + (sp.param || 0) * 1.06);
          const p = Math.max(0, Math.min(1, (introElapsed - spStart) / 0.36));
          if (p <= 0) continue;
          spIntroAlpha = easeOutCubic(p);
          spIntroScale = 0.35 + 0.65 * easeOutBack(p);
        }

        let px = sp.x, py = sp.y, pz = sp.z;
        if (sp.kind === 'ground') {
          px = sp.x * cg - sp.z * sg;
          pz = sp.x * sg + sp.z * cg;
          py += Math.sin(sp.param * 28 - timeSec * 2.5) * 1.8;
        }
        py -= panY;
        const rx = px * cosY - pz * sinY;
        const rz1 = px * sinY + pz * cosY;
        const depth = py * sinP + rz1 * cosP + camDist;
        if (depth <= 25) continue;

        const scale = fov / depth;
        const sx = cx + rx * scale;
        const sy = cy - (py * cosP - rz1 * sinP) * scale;

        let twinkle = 0.62 + 0.38 * Math.sin(timeSec * 3.8 + sp.phase);
        if (sp.kind === 'ribbon') {
          twinkle *= 0.65 + 0.55 * Math.sin(sp.param * 20 - timeSec * 4.5);
        }
        const diam = Math.max(2.5, sp.size * scale * 0.65 * glowMultiplier) * spIntroScale;
        ctx.globalAlpha = Math.min(1, (360 / depth) * twinkle * (isPaper ? 0.45 : 0.75) * glowMultiplier) * spIntroAlpha;
        ctx.drawImage(sp.sprite, sx - diam * 0.5, sy - diam * 0.5, diam, diam);
      }

      // 2.5 阶段 B：从地面破土飞升、沿树体螺旋向上聚合成树的发光尾迹粒子
      if (scenePhase === 'growing' && risingParticles.length > 0) {
        if (!isPaper) ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < risingParticles.length; i++) {
          const rp = risingParticles[i];
          const u = (introElapsed - rp.delay) / rp.dur;
          if (u <= 0 || u >= 1.12) continue;

          for (let k = 3; k >= 0; k--) {
            const uk = Math.max(0, Math.min(1, u - k * 0.032));
            const e = easeOutCubic(uk);
            const yy = -132 + e * 336;
            const rr = (1 - e) * 192 + 8 + rp.radialJitter * (1 - e * 0.7);
            const ang = rp.branch + e * 4.8 * Math.PI * 2 + rp.angleOffset;
            const px = Math.cos(ang) * rr;
            const pz = Math.sin(ang) * rr;
            const py = yy - panY;
            const rx = px * cosY - pz * sinY;
            const rz1 = px * sinY + pz * cosY;
            const depth = py * sinP + rz1 * cosP + camDist;
            if (depth <= 25) continue;
            const scale = fov / depth;
            const sx = cx + rx * scale;
            const sy = cy - (py * cosP - rz1 * sinP) * scale;
            const fadeOut = u > 0.85 ? Math.max(0, 1 - (u - 0.85) / 0.27) : 1;
            const tailWeight = 1 - k * 0.24;
            const d = rp.size * scale * 1.45 * tailWeight;
            ctx.globalAlpha = 0.88 * tailWeight * fadeOut;
            ctx.drawImage(rp.sprite, sx - d * 0.5, sy - d * 0.5, d, d);
          }
        }
      }

      ctx.globalCompositeOperation = 'source-over';

      // 3. 投影并排序 3D 颜文字与树上悬挂贺卡节点
      renderQueue.length = 0;
      const hRot = timeSec * 0.9;
      const ch = Math.cos(hRot), sh = Math.sin(hRot);
      let hoveringAnyCard = false;

      for (let i = 0; i < treeNodes.length; i++) {
        const n = treeNodes[i];
        if (n.type === 'kaomoji') {
          n.blinkTimer -= dt;
          if (n.blinkTimer <= 0) {
            n.blinking = !n.blinking;
            n.blinkTimer = n.blinking ? rand(0.18, 0.35) : rand(2.2, 6.2);
          }
          if (n.bounce > 0) n.bounce = Math.max(0, n.bounce - dt * 2.8);
        } else if (n.type === 'cardOrnament') {
          if (n.bounce > 0) n.bounce = Math.max(0, n.bounce - dt * 2.2);
        }

        let x = n.x, y = n.y, z = n.z;
        if (n.type === 'kaomoji') {
          y += Math.sin(timeSec * 2.4 + n.phase) * 2.2 + Math.sin(n.bounce * Math.PI) * 10;
        } else if (n.type === 'cardOrnament') {
          y += Math.sin(timeSec * 2.0 + n.phase) * 2.8 + Math.sin(n.bounce * Math.PI) * 14;
        } else if (n.type === 'starHalo') {
          x = n.x * ch - n.z * sh;
          z = n.x * sh + n.z * ch;
        }

        const py = y - panY;
        const rx = x * cosY - z * sinY;
        const rz1 = x * sinY + z * cosY;
        const depth = py * sinP + rz1 * cosP + camDist;
        if (depth <= 25) continue;

        const scale = fov / depth;
        const sx = cx + rx * scale;
        const sy = cy - (py * cosP - rz1 * sinP) * scale;

        if (scenePhase === 'ready') {
          if (n.type === 'kaomoji' && !draggingLeft) {
            const dxm = sx - mouseX, dym = sy - mouseY;
            if (dxm * dxm + dym * dym < 2300 && n.bounce < 0.2) {
              n.bounce = 0.85;
              n.blinking = true;
              n.blinkTimer = 0.35;
            }
          } else if (n.type === 'cardOrnament') {
            const hitR = Math.max(22, Math.min(42, 27 * scale * sizeMultiplier));
            const isHover = !draggingLeft && ((sx - mouseX) ** 2 + (sy - mouseY) ** 2 <= hitR * hitR);
            if (isHover) hoveringAnyCard = true;
            const targetHover = isHover ? 1.32 : 1.0;
            n.hoverScale += (targetHover - n.hoverScale) * Math.min(1, dt * 12);
          }
        }

        renderQueue.push({ node: n, sx, sy, depth, scale });
      }

      if (scenePhase !== 'ready') {
        canvas.style.cursor = 'default';
      } else if (!draggingLeft && !draggingRight) {
        canvas.style.cursor = hoveringAnyCard ? 'pointer' : 'grab';
      }

      renderQueue.sort((a, b) => b.depth - a.depth);

      // 4. 绘制所有 3D 颜文字与树上悬挂贺卡（100% 预烘焙纹理 drawImage，丝滑满帧！）
      const rayAngles = [-0.45, 0, 0.45, Math.PI - 0.45, Math.PI, Math.PI + 0.45];

      for (let i = 0; i < renderQueue.length; i++) {
        const { node, sx, sy, depth, scale } = renderQueue[i];
        let introAlpha = 1;
        let introPop = 1;
        let drawX = sx;
        let drawY = sy;

        if (!introComplete) {
          let tStart = 0.12;
          let tDur = 0.42;
          if (node.type === 'topStar' || node.type === 'starHalo') {
            tStart = 1.08;
            tDur = 0.46;
          } else if (node.type === 'cardOrnament') {
            const hNorm = Math.max(0, Math.min(1, (node.y + 135) / 315));
            tStart = 1.22 + hNorm * 0.38;
            tDur = 0.42;
          } else {
            const hNorm = Math.max(0, Math.min(1, (node.y + 135) / 315));
            tStart = 0.12 + hNorm * 0.96;
            tDur = 0.42;
          }
          const p = Math.max(0, Math.min(1, (introElapsed - tStart) / tDur));
          if (p <= 0) continue;
          const introEase = easeOutCubic(p);
          introAlpha = introEase;
          introPop = easeOutBack(p);
          if (node.type === 'cardOrnament') {
            drawY = sy - (1 - introEase) * 14;
          } else if (node.type !== 'topStar') {
            drawX = cx + (sx - cx) * (0.68 + 0.32 * introEase);
            drawY = sy + (1 - introEase) * 20;
          }
        }

        const depthRatio = Math.max(0.18, Math.min(1.0, (camDist + 165 - depth) / 310 + 0.36));
        const targetPx = Math.max(8, node.fontSize * scale * sizeMultiplier * 0.72);
        const sp = node.blinking ? node.spriteB : node.spriteA;

        if (node.type === 'topStar') {
          if (!introStarBurstDone && introElapsed >= 1.12) {
            introStarBurstDone = true;
            spawnIntroStarBurst(drawX, drawY);
          }
          const pulse = 1 + 0.08 * Math.sin(timeSec * 4.2);
          const starSize = targetPx * pulse * (introComplete ? 1 : (0.12 + 0.88 * introPop));
          const ratio = starSize / sp.baseFontPx;
          const dw = sp.w * ratio;
          const dh = sp.h * ratio;

          ctx.globalAlpha = introAlpha;
          ctx.drawImage(sp.canvas, drawX - dw * 0.5, drawY - dh * 0.5, dw, dh);

          // 6 条手绘光芒短线（ミ ★ 彡）
          ctx.strokeStyle = theme.starColor;
          ctx.lineWidth = Math.max(1.8, starSize * 0.08);
          ctx.lineCap = 'round';
          const rInner = starSize * 0.62;
          const rOuter = starSize * (0.94 + 0.1 * Math.sin(timeSec * 5.0));
          ctx.beginPath();
          for (let r = 0; r < 6; r++) {
            const a = rayAngles[r];
            const ca = Math.cos(a), sa = Math.sin(a);
            ctx.moveTo(drawX + ca * rInner, drawY + sa * rInner);
            ctx.lineTo(drawX + ca * rOuter, drawY + sa * rOuter);
          }
          ctx.stroke();
          continue;
        }

        if (node.type === 'cardOrnament') {
          // 树上悬挂的 3D 极简手绘贺卡（带轻柔钟摆微晃 + 悬停放大）
          const swing = Math.sin(timeSec * 2.2 + node.phase) * 0.14;
          const popScale = introComplete ? 1 : (0.18 + 0.82 * introPop);
          const cardScale = (targetPx * node.hoverScale * popScale) / sp.baseFontPx;
          const dw = sp.w * cardScale;
          const dh = sp.h * cardScale;

          ctx.save();
          ctx.globalAlpha = (isPaper
            ? (0.40 + depthRatio * 0.60)
            : (0.35 + depthRatio * 0.65)) * introAlpha;
          ctx.translate(drawX, drawY);
          ctx.rotate(swing);
          ctx.drawImage(sp.canvas, -dw * 0.5, -dh * 0.5, dw, dh);
          ctx.restore();
          continue;
        }

        const popScale = introComplete ? 1 : (0.24 + 0.76 * introPop);
        const ratio = (targetPx * popScale) / sp.baseFontPx;
        const dw = sp.w * ratio;
        const dh = sp.h * ratio;

        ctx.globalAlpha = ((node.type === 'trunkText')
          ? 0.96
          : (isPaper ? (0.28 + depthRatio * 0.72) : (0.22 + depthRatio * 0.78))) * introAlpha;

        ctx.drawImage(sp.canvas, drawX - dw * 0.5, drawY - dh * 0.5, dw, dh);
      }

      // 5. 渲染点击粒子特效
      renderBurstEffects(dt, timeSec);

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    // =========================================================================
    // React Bits 交互动效模块（零外部依赖原生移植：Magnet / StarBorder / TiltedCard）
    // =========================================================================
    (() => {
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) return;

      // 1. React Bits Magnet（对标官方 magnetStrength≈2 / padding≈100 强磁吸弹簧交互，基于静止锚点避免反馈抖动）
      const magnetNodes = [];
      const magnetTargets = [
        { el: document.getElementById('plantBtnWrap'), padding: 115, strength: 2.0, maxOffset: 20 },
        { el: document.getElementById('starBorderWrap'), padding: 80, strength: 2.6, maxOffset: 14 }
      ].filter((item) => item.el);

      let ptrX = -9999, ptrY = -9999, ptrActive = false;

      magnetTargets.forEach((cfg) => {
        magnetNodes.push({
          ...cfg,
          x: 0, y: 0, vx: 0, vy: 0,
          raf: 0, last: 0
        });
      });

      const smoothstep = (e0, e1, v) => {
        const t = Math.min(1, Math.max(0, (v - e0) / (e1 - e0)));
        return t * t * (3 - 2 * t);
      };

      function stepMagnet(m, now) {
        m.raf = 0;
        if (!m.el.isConnected) return;
        const dt = m.last ? Math.min((now - m.last) / 1000, 1 / 30) : 1 / 60;
        m.last = now;

        let tx = 0, ty = 0;
        if (ptrActive && !draggingLeft && !draggingRight) {
          const rect = m.el.getBoundingClientRect();
          if (rect.width > 0 && rect.height > 0) {
            const restCx = rect.left + rect.width * 0.5 - m.x;
            const restCy = rect.top + rect.height * 0.5 - m.y;
            const dx = ptrX - restCx;
            const dy = ptrY - restCy;
            const outside = Math.hypot(
              Math.max(0, Math.abs(dx) - rect.width * 0.5),
              Math.max(0, Math.abs(dy) - rect.height * 0.5)
            );
            if (outside <= m.padding) {
              const pull = 1 - smoothstep(m.padding * 0.45, m.padding, outside);
              tx = (dx / m.strength) * pull;
              ty = (dy / m.strength) * pull;
              const len = Math.hypot(tx, ty);
              if (len > m.maxOffset) {
                tx *= m.maxOffset / len;
                ty *= m.maxOffset / len;
              }
            }
          }
        }

        const stiffness = 170, damping = 16;
        const fx = stiffness * (tx - m.x) - damping * m.vx;
        const fy = stiffness * (ty - m.y) - damping * m.vy;
        m.vx += fx * dt;
        m.vy += fy * dt;
        m.x += m.vx * dt;
        m.y += m.vy * dt;

        m.el.style.setProperty('--mag-x', `${m.x.toFixed(2)}px`);
        m.el.style.setProperty('--mag-y', `${m.y.toFixed(2)}px`);

        const resting = Math.abs(tx - m.x) < 0.04 && Math.abs(ty - m.y) < 0.04 &&
                        Math.abs(m.vx) < 0.05 && Math.abs(m.vy) < 0.05;
        if (resting) {
          m.x = tx; m.y = ty; m.vx = 0; m.vy = 0;
          m.el.style.setProperty('--mag-x', `${tx.toFixed(2)}px`);
          m.el.style.setProperty('--mag-y', `${ty.toFixed(2)}px`);
          m.last = 0;
        } else {
          m.raf = requestAnimationFrame((t) => stepMagnet(m, t));
        }
      }

      window.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'touch') return;
        ptrX = e.clientX;
        ptrY = e.clientY;
        ptrActive = true;
        for (const m of magnetNodes) {
          if (!m.raf) m.raf = requestAnimationFrame((t) => stepMagnet(m, t));
        }
      }, { passive: true });

      document.documentElement.addEventListener('pointerleave', () => {
        ptrActive = false;
        for (const m of magnetNodes) {
          if (!m.raf) m.raf = requestAnimationFrame((t) => stepMagnet(m, t));
        }
      });

      // 2. React Bits StarBorder（共用于「种下」胶囊按钮与「写一张贺卡挂上树」主按钮）
      function attachStarBorder(starBtn, starCanvas, getRadius) {
        if (!starBtn || !starCanvas) return;
        const sctx = starCanvas.getContext('2d');
        const BLEED = 22;
        let phase = Math.random() * 120;
        let speedBoost = 0;
        let hovered = false;
        let lastT = performance.now();
        const dust = [];
        let emitAcc = 0;

        function buildOutline(w, h, r) {
          const cr = Math.min(r, w / 2, h / 2);
          const arc = (Math.PI * cr) / 2;
          const across = Math.max(0, w - 2 * cr);
          const down = Math.max(0, h - 2 * cr);
          const segs = [
            { len: across, x: cr, y: 0, dx: 1, dy: 0, ang: null },
            { len: arc, x: w - cr, y: cr, dx: 0, dy: 0, ang: -Math.PI / 2 },
            { len: down, x: w, y: cr, dx: 0, dy: 1, ang: null },
            { len: arc, x: w - cr, y: h - cr, dx: 0, dy: 0, ang: 0 },
            { len: across, x: w - cr, y: h, dx: -1, dy: 0, ang: null },
            { len: arc, x: cr, y: h - cr, dx: 0, dy: 0, ang: Math.PI / 2 },
            { len: down, x: 0, y: h - cr, dx: 0, dy: -1, ang: null },
            { len: arc, x: cr, y: cr, dx: 0, dy: 0, ang: Math.PI }
          ];
          const total = segs.reduce((acc, s) => acc + s.len, 0) || 1;
          return { cr, segs, total };
        }

        function samplePoint(shape, dist) {
          let s = ((dist % shape.total) + shape.total) % shape.total;
          for (const seg of shape.segs) {
            if (seg.len > 0 && s <= seg.len) {
              if (seg.ang === null) {
                return { x: seg.x + seg.dx * s, y: seg.y + seg.dy * s, nx: seg.dy, ny: -seg.dx };
              }
              const a = seg.ang + s / shape.cr;
              const nx = Math.cos(a), ny = Math.sin(a);
              return { x: seg.x + nx * shape.cr, y: seg.y + ny * shape.cr, nx, ny };
            }
            s -= seg.len;
          }
          return { x: 0, y: 0, nx: 0, ny: -1 };
        }

        starBtn.addEventListener('pointerenter', () => { hovered = true; speedBoost = 1.0; });
        starBtn.addEventListener('pointerleave', () => { hovered = false; });

        function renderStarBorder(now) {
          if (!starBtn.isConnected) return;
          const dt = Math.min(0.05, (now - lastT) * 0.001);
          lastT = now;

          const rect = starBtn.getBoundingClientRect();
          const w = Math.max(1, Math.round(rect.width));
          const h = Math.max(1, Math.round(rect.height));
          const cw = w + BLEED * 2;
          const ch = h + BLEED * 2;
          const sdpr = Math.min(window.devicePixelRatio || 1, 2);

          if (starCanvas.width !== Math.floor(cw * sdpr) || starCanvas.height !== Math.floor(ch * sdpr)) {
            starCanvas.width = Math.floor(cw * sdpr);
            starCanvas.height = Math.floor(ch * sdpr);
          }

          sctx.setTransform(sdpr, 0, 0, sdpr, 0, 0);
          sctx.clearRect(0, 0, cw, ch);

          const radius = getRadius(w, h);
          const shape = buildOutline(w, h, radius);
          speedBoost += ((hovered ? 1.0 : 0.0) - speedBoost) * Math.min(1, dt * 6);
          const velocity = 82 + speedBoost * 190;
          phase += velocity * dt;

          const starRgb = '255, 240, 195';

          // 绘制两颗对称绕边游走的星光尾迹
          for (let starIdx = 0; starIdx < 2; starIdx++) {
            const baseDist = phase + starIdx * (shape.total * 0.5);
            const trailSteps = hovered ? 18 : 13;
            for (let k = trailSteps; k >= 0; k--) {
              const p = samplePoint(shape, baseDist - k * 3.2);
              const t = 1 - k / trailSteps;
              const alpha = (t * t) * (hovered ? 0.85 : 0.52);
              const r = 0.8 + t * (hovered ? 1.9 : 1.3);
              sctx.fillStyle = `rgba(${starRgb}, ${alpha.toFixed(3)})`;
              sctx.beginPath();
              sctx.arc(BLEED + p.x, BLEED + p.y, r, 0, Math.PI * 2);
              sctx.fill();
            }

            // 头部小星芒
            const head = samplePoint(shape, baseDist);
            const hx = BLEED + head.x;
            const hy = BLEED + head.y;
            const arm = hovered ? 5.2 : 3.6;
            sctx.strokeStyle = `rgba(${starRgb}, ${hovered ? 0.95 : 0.72})`;
            sctx.lineWidth = 1.1;
            sctx.beginPath();
            sctx.moveTo(hx - arm, hy); sctx.lineTo(hx + arm, hy);
            sctx.moveTo(hx, hy - arm); sctx.lineTo(hx, hy + arm);
            sctx.stroke();
          }

          // 悬停时沿边框逸出细小星尘
          if (hovered) {
            emitAcc += dt * 16;
            while (emitAcc > 1) {
              emitAcc -= 1;
              const p = samplePoint(shape, phase);
              dust.push({
                x: BLEED + p.x,
                y: BLEED + p.y,
                vx: p.nx * (12 + Math.random() * 24) + (Math.random() - 0.5) * 14,
                vy: p.ny * (12 + Math.random() * 24) - 8,
                age: 0,
                life: 0.4 + Math.random() * 0.35
              });
            }
          }

          for (let i = dust.length - 1; i >= 0; i--) {
            const d = dust[i];
            d.age += dt;
            if (d.age >= d.life) {
              dust.splice(i, 1);
              continue;
            }
            d.x += d.vx * dt;
            d.y += d.vy * dt;
            const a = (1 - d.age / d.life) * 0.75;
            sctx.fillStyle = `rgba(${starRgb}, ${a.toFixed(3)})`;
            sctx.beginPath();
            sctx.arc(d.x, d.y, 1.1, 0, Math.PI * 2);
            sctx.fill();
          }

          requestAnimationFrame(renderStarBorder);
        }

        requestAnimationFrame(renderStarBorder);
      }

      attachStarBorder(document.getElementById('btnPlantTree'), document.getElementById('plantStarCanvas'), (_, h) => h * 0.5);
      attachStarBorder(document.getElementById('btnWriteCard'), document.getElementById('starBorderCanvas'), () => 8);

      // 3. React Bits TiltedCard（打开信封后鼠标悬停 3D 视差倾斜 + 纸张镜面高光）
      const envStage = document.getElementById('envelopeStage');
      const envTilt  = document.getElementById('envelopeTiltLayer');
      if (envStage && envTilt) {
        let tx = 0, ty = 0, cxTilt = 0, cyTilt = 0;
        let gx = 50, gy = 50, cgx = 50, cgy = 50;
        let gOp = 0, cgOp = 0;
        let tiltRaf = 0;

        function stepTilt() {
          tiltRaf = 0;
          cxTilt += (tx - cxTilt) * 0.14;
          cyTilt += (ty - cyTilt) * 0.14;
          cgx += (gx - cgx) * 0.16;
          cgy += (gy - cgy) * 0.16;
          cgOp += (gOp - cgOp) * 0.14;

          envTilt.style.setProperty('--tilt-x', `${cxTilt.toFixed(2)}deg`);
          envTilt.style.setProperty('--tilt-y', `${cyTilt.toFixed(2)}deg`);
          envTilt.style.setProperty('--glare-x', `${cgx.toFixed(1)}%`);
          envTilt.style.setProperty('--glare-y', `${cgy.toFixed(1)}%`);
          envTilt.style.setProperty('--glare-op', cgOp.toFixed(3));

          const settled = Math.abs(tx - cxTilt) < 0.03 && Math.abs(ty - cyTilt) < 0.03 && Math.abs(gOp - cgOp) < 0.01;
          if (!settled) tiltRaf = requestAnimationFrame(stepTilt);
        }

        envStage.addEventListener('pointermove', (e) => {
          if (e.pointerType === 'touch' || !envelopeShell.classList.contains('is-opened')) return;
          const r = envStage.getBoundingClientRect();
          const nx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / Math.max(1, r.width)) * 2 - 1));
          const ny = Math.max(-1, Math.min(1, ((e.clientY - r.top) / Math.max(1, r.height)) * 2 - 1));
          tx = -ny * 6.5;
          ty = nx * 7.5;
          gx = ((nx + 1) * 0.5) * 100;
          gy = ((ny + 1) * 0.5) * 100;
          gOp = 1;
          if (!tiltRaf) tiltRaf = requestAnimationFrame(stepTilt);
        }, { passive: true });

        envStage.addEventListener('pointerleave', () => {
          tx = 0; ty = 0; gOp = 0;
          if (!tiltRaf) tiltRaf = requestAnimationFrame(stepTilt);
        });
      }
    })();

    // =========================================================================
    // 背景音乐：打开即播（拦截时自动在首次交互/微信桥接就绪时瞬时解锁播放）
    // =========================================================================
    (() => {
      const bgm = document.getElementById('bgmAudio');
      const bgmBtn = document.getElementById('bgmToggle');
      if (!bgm) return;

      bgm.volume = 0.52;
      let userPaused = false;
      let gestureBound = false;

      function syncBgmUi() {
        if (!bgmBtn) return;
        const playing = !bgm.paused && !bgm.ended;
        bgmBtn.classList.toggle('is-playing', playing);
        bgmBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
      }

      function removeUnlockListeners() {
        if (!gestureBound) return;
        gestureBound = false;
        window.removeEventListener('pointerdown', onFirstGesture, true);
        window.removeEventListener('touchstart', onFirstGesture, true);
        window.removeEventListener('keydown', onFirstGesture, true);
        window.removeEventListener('click', onFirstGesture, true);
      }

      function tryStartBgm() {
        if (userPaused) return;
        const p = bgm.play();
        if (p && typeof p.then === 'function') {
          p.then(() => {
            syncBgmUi();
            removeUnlockListeners();
          }).catch(() => {
            syncBgmUi();
          });
        } else {
          syncBgmUi();
        }
      }

      function onFirstGesture(e) {
        if (bgmBtn && bgmBtn.contains(e.target)) return;
        if (!userPaused && bgm.paused) {
          tryStartBgm();
        } else {
          removeUnlockListeners();
        }
      }

      bgm.addEventListener('play', syncBgmUi);
      bgm.addEventListener('pause', syncBgmUi);

      if (bgmBtn) {
        bgmBtn.addEventListener('click', () => {
          if (bgm.paused) {
            userPaused = false;
            tryStartBgm();
          } else {
            userPaused = true;
            bgm.pause();
          }
        });
      }

      // 绑定首次任意操作兜底解锁（兼容移动端浏览器与桌面严格自动播放策略）
      gestureBound = true;
      window.addEventListener('pointerdown', onFirstGesture, { capture: true, passive: true });
      window.addEventListener('touchstart', onFirstGesture, { capture: true, passive: true });
      window.addEventListener('keydown', onFirstGesture, { capture: true, passive: true });
      window.addEventListener('click', onFirstGesture, { capture: true, passive: true });

      // 微信内置浏览器自动播放支持
      document.addEventListener('WeixinJSBridgeReady', () => {
        if (!userPaused) tryStartBgm();
      }, false);

      // 页面打开第一时间尝试播放
      tryStartBgm();

      // 加载并实时同步 bgm.lrc 歌词字幕
      const lyricBarEl = document.getElementById('lyricBar');
      const lyricMainEl = document.getElementById('lyricMain');
      const lyricSubEl = document.getElementById('lyricSub');
      let lyricLines = [];
      let activeLyricIdx = -1;
      let lyricAnimTimer = 0;

      function parseLrcText(raw) {
        const lines = [];
        let offsetSec = 0;
        const rows = String(raw || '').split(/\r?\n/);
        for (const row of rows) {
          const offsetMatch = row.match(/\[offset:\s*([+-]?\d+)\s*\]/i);
          if (offsetMatch) {
            offsetSec = parseInt(offsetMatch[1], 10) * 0.001;
            continue;
          }
          const timeTags = [...row.matchAll(/\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g)];
          if (!timeTags.length) continue;
          const text = row.replace(/\[\d{1,3}:\d{1,2}(?:[.:]\d{1,3})?\]/g, '').trim();
          for (const m of timeTags) {
            const min = parseInt(m[1], 10);
            const sec = parseInt(m[2], 10);
            const msRaw = m[3] || '0';
            const ms = parseInt(msRaw.padEnd(3, '0').slice(0, 3), 10);
            const time = Math.max(0, min * 60 + sec + ms * 0.001 + offsetSec);
            lines.push({ time, text });
          }
        }
        lines.sort((a, b) => a.time - b.time);

        // 合并同时间戳的双语行（例如原文 + 中文翻译）
        const merged = [];
        for (const item of lines) {
          const last = merged[merged.length - 1];
          if (last && Math.abs(last.time - item.time) < 0.08 && item.text) {
            if (!last.sub) last.sub = item.text;
          } else {
            merged.push({ time: item.time, main: item.text, sub: '' });
          }
        }
        return merged;
      }

      function syncLyricFrame() {
        if (!lyricLines.length || !lyricBarEl || !lyricMainEl) return;
        const t = bgm.currentTime || 0;
        let idx = -1;
        for (let i = 0; i < lyricLines.length; i++) {
          if (t + 0.08 >= lyricLines[i].time) idx = i;
          else break;
        }
        if (idx === activeLyricIdx) return;
        activeLyricIdx = idx;
        const item = idx >= 0 ? lyricLines[idx] : null;
        if (!item || !item.main) {
          lyricBarEl.classList.remove('has-lyric');
          return;
        }
        lyricMainEl.textContent = item.main;
        if (lyricSubEl) lyricSubEl.textContent = item.sub || '';
        lyricBarEl.classList.add('has-lyric');
        lyricBarEl.classList.remove('is-changing');
        void lyricBarEl.offsetWidth;
        lyricBarEl.classList.add('is-changing');
        clearTimeout(lyricAnimTimer);
        lyricAnimTimer = setTimeout(() => lyricBarEl.classList.remove('is-changing'), 380);
      }

      fetch('bgm.lrc')
        .then((res) => (res.ok ? res.text() : ''))
        .then((text) => {
          if (!text) return;
          lyricLines = parseLrcText(text);
          if (lyricLines.length) {
            bgm.addEventListener('timeupdate', syncLyricFrame);
            bgm.addEventListener('seeked', syncLyricFrame);
            bgm.addEventListener('play', syncLyricFrame);
            syncLyricFrame();
          }
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
