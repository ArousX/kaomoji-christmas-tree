    canvas.addEventListener('mousedown', (e) => {
      if (scenePhase !== 'ready') return;
      if (e.button === 0) {
        pointerDownLeft = true;
        draggingLeft = false;
      }
      if (e.button === 2) draggingRight = true;
      pointerDownX = lastX = e.clientX;
      pointerDownY = lastY = e.clientY;
    });

    window.addEventListener('mouseup', (e) => {
      if (pointerDownLeft && !draggingLeft) {
        handleCanvasClick(e.clientX, e.clientY);
      }
      pointerDownLeft = false;
      draggingLeft = false;
      draggingRight = false;
    });

    window.addEventListener('mousemove', (e) => {
      const nowMs = performance.now();
      if (mouseActive && lastMoveTs > 0) {
        const moveDt = Math.max(0.008, (nowMs - lastMoveTs) * 0.001);
        const rawVx = (e.clientX - lastMoveX) / moveDt;
        const rawVy = (e.clientY - lastMoveY) / moveDt;
        mouseVx = Math.max(-1400, Math.min(1400, mouseVx * 0.45 + rawVx * 0.55));
        mouseVy = Math.max(-1400, Math.min(1400, mouseVy * 0.45 + rawVy * 0.55));
      }
      lastMoveX = mouseX = e.clientX;
      lastMoveY = mouseY = e.clientY;
      lastMoveTs = nowMs;
      mouseActive = true;
      if (!pointerDownLeft && !draggingRight) return;

      if (pointerDownLeft && !draggingLeft) {
        if (Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY) < 5) {
          return;
        }
        draggingLeft = true;
        lastX = e.clientX;
        lastY = e.clientY;
        return;
      }

      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      if (draggingLeft) {
        const sens = 0.0068;
        yaw += dx * sens;
        pitch = Math.max(-0.55, Math.min(1.15, pitch + dy * sens));
        velYaw = dx * 0.28;
        velPitch = dy * 0.25;
      } else if (draggingRight) {
        panX += dx * 0.8;
        panY += dy * 0.55;
      }
    });

    document.documentElement.addEventListener('mouseleave', () => {
      mouseActive = false;
    });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('wheel', (e) => {
      if (cardModalBackdrop.classList.contains('open') || composeModalBackdrop.classList.contains('open')) return;
      e.preventDefault();
      if (scenePhase !== 'ready') return;
      targetGlobe = Math.max(0, Math.min(1, targetGlobe + e.deltaY * 0.00165));
    }, { passive: false });

    let pinchStartDist = 0;
    let pinchStartGlobe = 0;

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2 && scenePhase === 'ready') {
        pointerDownLeft = false;
        draggingLeft = false;
        pinchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        pinchStartGlobe = targetGlobe;
        return;
      }
      if (e.touches.length === 1) {
        const t = e.touches[0];
        lastMoveX = mouseX = t.clientX;
        lastMoveY = mouseY = t.clientY;
        lastMoveTs = performance.now();
        mouseActive = true;
        if (scenePhase !== 'ready') return;
        pointerDownLeft = true;
        draggingLeft = false;
        pointerDownX = lastX = t.clientX;
        pointerDownY = lastY = t.clientY;
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) pinchStartDist = 0;
      mouseActive = false;
      if (pointerDownLeft && !draggingLeft) {
        handleCanvasClick(pointerDownX, pointerDownY);
      }
      pointerDownLeft = false;
      draggingLeft = false;
    });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && scenePhase === 'ready' && pinchStartDist > 10) {
        const curDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const ratioDelta = (pinchStartDist - curDist) / 180;
        targetGlobe = Math.max(0, Math.min(1, pinchStartGlobe + ratioDelta));
        return;
      }
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      const tx = t.clientX;
      const ty = t.clientY;
      const nowMs = performance.now();
      if (mouseActive && lastMoveTs > 0) {
        const moveDt = Math.max(0.008, (nowMs - lastMoveTs) * 0.001);
        const rawVx = (tx - lastMoveX) / moveDt;
        const rawVy = (ty - lastMoveY) / moveDt;
        mouseVx = Math.max(-1400, Math.min(1400, mouseVx * 0.45 + rawVx * 0.55));
        mouseVy = Math.max(-1400, Math.min(1400, mouseVy * 0.45 + rawVy * 0.55));
      }
      lastMoveX = mouseX = tx;
      lastMoveY = mouseY = ty;
      lastMoveTs = nowMs;
      mouseActive = true;

      if (!pointerDownLeft || scenePhase !== 'ready') return;
      if (!draggingLeft) {
        if (Math.hypot(tx - pointerDownX, ty - pointerDownY) < 5) return;
        draggingLeft = true;
        lastX = tx;
        lastY = ty;
        return;
      }
      const dx = tx - lastX;
      const dy = ty - lastY;
      lastX = tx;
      lastY = ty;
      yaw += dx * 0.0068;
      pitch = Math.max(-0.55, Math.min(1.15, pitch + dy * 0.0068));
      velYaw = dx * 0.25;
      velPitch = dy * 0.25;
    }, { passive: true });

    // =========================================================================
    // 超高速 drawImage 3D 渲染主循环
    // =========================================================================
    let viewW = 0;
    let viewH = 0;
    let dpr = 1;

    function resizeCanvas() {
      const w = window.innerWidth || document.documentElement.clientWidth || 1280;
      const h = window.innerHeight || document.documentElement.clientHeight || 720;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (w === viewW && h === viewH && canvas.width === Math.floor(w * dpr)) return;
      viewW = w;
      viewH = h;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      rebuildBackgroundCache(viewW, viewH);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const renderQueue = [];
    let prevTime = performance.now();

    let firstSnowTime = 0;

    // 移轴景深离屏双级降采样缓冲（零额外依赖、全端 60fps 光学虚化）
    const tiltTinyCanvas = document.createElement('canvas');
    const tiltTinyCtx = tiltTinyCanvas.getContext('2d');
    const tiltBlurCanvas = document.createElement('canvas');
    const tiltBlurCtx = tiltBlurCanvas.getContext('2d');

    function getSnowGlobeProjection(fov, cx, cy, sinP, cosP) {
      const gPy = 12 - panY;
      const gDepth = Math.max(40, gPy * sinP + camDist);
      const gScale = fov / gDepth;
      return {
        gDepth,
        gScale,
        gx: cx,
        gy: cy - (gPy * cosP) * gScale,
        radius: 284 * gScale
      };
    }

    const globeGlitter = Array.from({ length: 42 }, (_, idx) => ({
      ang: (idx * 2.39996) % (Math.PI * 2),
      rad: rand(70, 232),
      y: rand(-148, 225),
      speed: rand(0.18, 0.45) * (idx % 2 === 0 ? 1 : -1),
      bobPhase: rand(0, Math.PI * 2),
      size: rand(1.6, 3.6),
      warm: idx % 3 === 0
    }));

    function projectGlobeWorld(wx, wy, wz, cosY, sinY, cosP, sinP, fov, cx, cy) {
      const py = wy - panY;
      const rx = wx * cosY - wz * sinY;
      const rz1 = wx * sinY + wz * cosY;
      const depth = Math.max(30, py * sinP + rz1 * cosP + camDist);
      const scale = fov / depth;
      return {
        sx: cx + rx * scale,
        sy: cy - (py * cosP - rz1 * sinP) * scale,
        depth,
        scale,
        rx,
        rz: rz1
      };
    }

    function drawPoly(pts, fillStyle, strokeStyle = null, lineWidth = 1) {
      ctx.beginPath();
      ctx.moveTo(pts[0].sx, pts[0].sy);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].sx, pts[i].sy);
      ctx.closePath();
      if (fillStyle) {
        ctx.fillStyle = fillStyle;
        ctx.fill();
      }
      if (strokeStyle) {
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = lineWidth;
        ctx.lineJoin = 'round';
        ctx.stroke();
      }
    }

    function draw3DAlpineChalet(prop, alpha, timeSec, isPaper, cosY, sinY, cosP, sinP, fov, cx, cy) {
      if (alpha <= 0.01 || prop.depth <= 35) return;
      const ox = prop.wx, oy = prop.wy, oz = prop.wz;
      const houseYaw = prop.localYaw;
      const hw = 24, hd = 20, wh = 25, rh = 19;
      const ch = Math.cos(houseYaw), sh = Math.sin(houseYaw);

      function pt(lx, ly, lz) {
        const rx = lx * ch - lz * sh;
        const rz = lx * sh + lz * ch;
        return projectGlobeWorld(ox + rx, oy + ly, oz + rz, cosY, sinY, cosP, sinP, fov, cx, cy);
      }

      // 8 墙角 + 2 屋脊顶点 + 6 悬挑雪檐顶点
      const bFL = pt(-hw, 0, hd),   bFR = pt(hw, 0, hd),
            bBR = pt(hw, 0, -hd),  bBL = pt(-hw, 0, -hd);
      const tFL = pt(-hw, wh, hd),  tFR = pt(hw, wh, hd),
            tBR = pt(hw, wh, -hd), tBL = pt(-hw, wh, -hd);
      const rF  = pt(0, wh + rh, hd), rB = pt(0, wh + rh, -hd);
      const ov = 5.5, ovZ = 4.5, drop = -3.2;
      const eFL = pt(-hw - ov, wh + drop, hd + ovZ),
            eFR = pt(hw + ov,  wh + drop, hd + ovZ),
            eBR = pt(hw + ov,  wh + drop, -hd - ovZ),
            eBL = pt(-hw - ov, wh + drop, -hd - ovZ);
      const erF = pt(0, wh + rh + 2.2, hd + ovZ),
            erB = pt(0, wh + rh + 2.2, -hd - ovZ);

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = alpha;

      // 小屋基座积雪垫
      const baseC = pt(0, -1, 0);
      const sc = baseC.scale;
      ctx.fillStyle = isPaper ? 'rgba(255, 252, 244, 0.94)' : 'rgba(214, 232, 255, 0.88)';
      ctx.beginPath();
      ctx.ellipse(baseC.sx, baseC.sy, 38 * sc, 15 * sc, 0, 0, Math.PI * 2);
      ctx.fill();

      // 暖光向雪地洒出的光晕
      const glowG = ctx.createRadialGradient(baseC.sx, baseC.sy, 0, baseC.sx, baseC.sy, 46 * sc);
      glowG.addColorStop(0, isPaper ? 'rgba(240, 178, 72, 0.30)' : 'rgba(255, 198, 92, 0.36)');
      glowG.addColorStop(1, 'rgba(255, 198, 92, 0)');
      ctx.fillStyle = glowG;
      ctx.beginPath();
      ctx.ellipse(baseC.sx, baseC.sy + 3 * sc, 46 * sc, 20 * sc, 0, 0, Math.PI * 2);
      ctx.fill();

      const wallFront = isPaper ? '#936846' : '#53352b';
      const wallSide  = isPaper ? '#734e32' : '#3a231d';
      const gableCol  = isPaper ? '#a1734f' : '#614034';
      const timberLn  = isPaper ? 'rgba(54, 34, 20, 0.55)' : 'rgba(28, 16, 12, 0.72)';

      // 4 面墙与两面山墙按平均深度从远到近画（真 3D 立体旋转无破面）
      const walls = [
        { d: (bFL.depth + bFR.depth + tFR.depth + tFL.depth) * 0.25, kind: 'front', pts: [bFL, bFR, tFR, tFL], gable: [tFL, tFR, rF] },
        { d: (bBL.depth + bBR.depth + tBR.depth + tBL.depth) * 0.25, kind: 'back',  pts: [bBR, bBL, tBL, tBR], gable: [tBR, tBL, rB] },
        { d: (bBL.depth + bFL.depth + tFL.depth + tBL.depth) * 0.25, kind: 'left',  pts: [bBL, bFL, tFL, tBL] },
        { d: (bFR.depth + bBR.depth + tBR.depth + tFR.depth) * 0.25, kind: 'right', pts: [bFR, bBR, tBR, tFR] }
      ].sort((a, b) => b.d - a.d);

      function drawWindowQuad(u0, u1, v0, v1, pA, pB, pC, pD) {
        function bilerp(u, v) {
          const sx = (1 - v) * ((1 - u) * pA.sx + u * pB.sx) + v * ((1 - u) * pD.sx + u * pC.sx);
          const sy = (1 - v) * ((1 - u) * pA.sy + u * pB.sy) + v * ((1 - u) * pD.sy + u * pC.sy);
          return { sx, sy };
        }
        const q = [bilerp(u0, v0), bilerp(u1, v0), bilerp(u1, v1), bilerp(u0, v1)];
        drawPoly(q, '#ffe48c', timberLn, Math.max(0.8, 1.2 * sc));
        // 田字格木窗棂
        const mBot = bilerp((u0 + u1) * 0.5, v0), mTop = bilerp((u0 + u1) * 0.5, v1);
        const mL   = bilerp(u0, (v0 + v1) * 0.5), mR   = bilerp(u1, (v0 + v1) * 0.5);
        ctx.strokeStyle = timberLn;
        ctx.lineWidth = Math.max(0.7, 0.9 * sc);
        ctx.beginPath();
        ctx.moveTo(mBot.sx, mBot.sy); ctx.lineTo(mTop.sx, mTop.sy);
        ctx.moveTo(mL.sx, mL.sy);     ctx.lineTo(mR.sx, mR.sy);
        ctx.stroke();
      }

      for (const wFace of walls) {
        const col = (wFace.kind === 'front' || wFace.kind === 'back') ? wallFront : wallSide;
        drawPoly(wFace.pts, col, timberLn, Math.max(0.8, 1.1 * sc));
        if (wFace.gable) {
          drawPoly(wFace.gable, gableCol, timberLn, Math.max(0.8, 1.0 * sc));
        }
        const [pA, pB, pC, pD] = wFace.pts;
        if (wFace.kind === 'front') {
          // 拱形木门 + 二楼暖光山墙窗 + 门口小窗
          drawWindowQuad(0.16, 0.36, 0.34, 0.72, pA, pB, pC, pD);
          drawWindowQuad(0.45, 0.65, 0.04, 0.62, pA, pB, pC, pD);
          drawWindowQuad(0.70, 0.88, 0.34, 0.72, pA, pB, pC, pD);
          // 阁楼小窗
          const gMid = pt(0, wh + rh * 0.42, hd + 0.4);
          ctx.fillStyle = '#ffe699';
          ctx.beginPath();
          ctx.arc(gMid.sx, gMid.sy, Math.max(1.5, 3.6 * gMid.scale), 0, Math.PI * 2);
          ctx.fill();
        } else if (wFace.kind === 'left' || wFace.kind === 'right') {
          drawWindowQuad(0.20, 0.44, 0.34, 0.72, pA, pB, pC, pD);
          drawWindowQuad(0.56, 0.80, 0.34, 0.72, pA, pB, pC, pD);
        } else {
          drawWindowQuad(0.24, 0.46, 0.36, 0.72, pA, pB, pC, pD);
          drawWindowQuad(0.54, 0.76, 0.36, 0.72, pA, pB, pC, pD);
        }
      }

      // 两坡厚实积雪屋顶（带厚度质感与檐口串灯）
      const snowTopL = isPaper ? '#fffdf8' : '#f1f7ff';
      const snowTopR = isPaper ? '#efe6d5' : '#cddff5';
      const roofEdge = isPaper ? 'rgba(130, 108, 86, 0.45)' : 'rgba(160, 194, 232, 0.55)';
      const roofs = [
        { d: (eBL.depth + eFL.depth + erF.depth + erB.depth) * 0.25, pts: [eBL, eFL, erF, erB], col: snowTopL, e1: eBL, e2: eFL },
        { d: (eFR.depth + eBR.depth + erB.depth + erF.depth) * 0.25, pts: [eFR, eBR, erB, erF], col: snowTopR, e1: eFR, e2: eBR }
      ].sort((a, b) => b.d - a.d);

      for (const rf of roofs) {
        drawPoly(rf.pts, rf.col, roofEdge, Math.max(1, 1.3 * sc));
        // 屋檐 4 颗暖色小彩灯
        for (let b = 1; b <= 4; b++) {
          const u = b / 5;
          const bx = rf.e1.sx + (rf.e2.sx - rf.e1.sx) * u;
          const by = rf.e1.sy + (rf.e2.sy - rf.e1.sy) * u + 2 * sc;
          const twinkle = 0.65 + 0.35 * Math.sin(timeSec * 4.2 + b * 1.7);
          ctx.fillStyle = b % 2 === 0 ? `rgba(255, 224, 125, ${twinkle})` : `rgba(255, 138, 128, ${twinkle})`;
          ctx.beginPath();
          ctx.arc(bx, by, Math.max(1.2, 2.2 * sc), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 屋顶石砌烟囱 + 缕缕暖白炊烟
      const chB = pt(hw * 0.52, wh + rh * 0.45, -hd * 0.28);
      const chT = pt(hw * 0.52, wh + rh + 9, -hd * 0.28);
      ctx.fillStyle = isPaper ? '#8f4739' : '#733832';
      ctx.fillRect(chT.sx - 4 * chT.scale, chT.sy, 8 * chT.scale, Math.max(3, chB.sy - chT.sy));
      ctx.fillStyle = isPaper ? '#fffdf8' : '#eaf4ff';
      ctx.fillRect(chT.sx - 5 * chT.scale, chT.sy - 1.5 * chT.scale, 10 * chT.scale, 3 * chT.scale);
      for (let k = 0; k < 4; k++) {
        const p = (timeSec * 0.38 + k * 0.25) % 1;
        const sx2 = chT.sx + Math.sin(timeSec * 1.9 + k * 2.1) * 4 * sc + p * 8 * sc;
        const sy2 = chT.sy - p * 26 * sc;
        ctx.fillStyle = isPaper
          ? `rgba(116, 104, 92, ${(1 - p) * 0.30})`
          : `rgba(222, 238, 255, ${(1 - p) * 0.36})`;
        ctx.beginPath();
        ctx.arc(sx2, sy2, (2.2 + p * 4.6) * sc, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function draw3DMiniPine(prop, alpha, isPaper) {
      if (alpha <= 0.01 || prop.depth <= 35) return;
      const u = prop.scale * prop.sizeScale;
      if (u < 0.08) return;
      const sx = prop.sx, sy = prop.sy;
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = alpha;

      // 树干
      ctx.fillStyle = isPaper ? '#5c402c' : '#3a261d';
      ctx.fillRect(sx - 3 * u, sy - 6 * u, 6 * u, 9 * u);

      // 3 层落雪松冠
      const layers = [
        { y: -6 * u,  w: 22 * u, h: 20 * u },
        { y: -19 * u, w: 17 * u, h: 17 * u },
        { y: -30 * u, w: 12 * u, h: 14 * u }
      ];
      for (const ly of layers) {
        ctx.fillStyle = isPaper ? '#2d5a42' : '#184237';
        ctx.beginPath();
        ctx.moveTo(sx, sy + ly.y - ly.h);
        ctx.lineTo(sx - ly.w, sy + ly.y);
        ctx.quadraticCurveTo(sx, sy + ly.y + 4 * u, sx + ly.w, sy + ly.y);
        ctx.closePath();
        ctx.fill();

        // 树梢挂雪帽
        ctx.fillStyle = isPaper ? 'rgba(255, 252, 245, 0.92)' : 'rgba(226, 242, 255, 0.90)';
        ctx.beginPath();
        ctx.moveTo(sx, sy + ly.y - ly.h);
        ctx.lineTo(sx - ly.w * 0.62, sy + ly.y - ly.h * 0.36);
        ctx.quadraticCurveTo(sx, sy + ly.y - ly.h * 0.14, sx + ly.w * 0.62, sy + ly.y - ly.h * 0.36);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function draw3DStreetLamp(prop, alpha, timeSec, isPaper) {
      if (alpha <= 0.01 || prop.depth <= 35) return;
      const u = prop.scale;
      if (u < 0.08) return;
      const sx = prop.sx, sy = prop.sy;
      const postH = 38 * u;
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = alpha;

      // 雪地暖黄光池
      const gPool = ctx.createRadialGradient(sx, sy, 0, sx, sy, 28 * u);
      gPool.addColorStop(0, 'rgba(255, 210, 108, 0.42)');
      gPool.addColorStop(1, 'rgba(255, 210, 108, 0)');
      ctx.fillStyle = gPool;
      ctx.beginPath();
      ctx.ellipse(sx, sy + 2 * u, 28 * u, 11 * u, 0, 0, Math.PI * 2);
      ctx.fill();

      // 铁艺灯柱
      ctx.strokeStyle = isPaper ? '#3a342e' : '#1b2230';
      ctx.lineWidth = Math.max(1.4, 2.6 * u);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(sx, sy + 2 * u);
      ctx.lineTo(sx, sy - postH);
      ctx.stroke();

      // 发光灯罩与十字小檐
      const pulse = 0.88 + 0.12 * Math.sin(timeSec * 3.5);
      const lGlow = ctx.createRadialGradient(sx, sy - postH - 4 * u, 0, sx, sy - postH - 4 * u, 15 * u);
      lGlow.addColorStop(0, `rgba(255, 240, 178, ${0.95 * pulse})`);
      lGlow.addColorStop(0.35, `rgba(255, 200, 96, ${0.42 * pulse})`);
      lGlow.addColorStop(1, 'rgba(255, 200, 96, 0)');
      ctx.fillStyle = lGlow;
      ctx.beginPath();
      ctx.arc(sx, sy - postH - 4 * u, 15 * u, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffe99f';
      ctx.beginPath();
      ctx.roundRect(sx - 3.2 * u, sy - postH - 7 * u, 6.4 * u, 7.5 * u, 1.5 * u);
      ctx.fill();
      ctx.fillStyle = isPaper ? '#3a342e' : '#1b2230';
      ctx.beginPath();
      ctx.moveTo(sx - 5.5 * u, sy - postH - 7 * u);
      ctx.lineTo(sx, sy - postH - 11.5 * u);
      ctx.lineTo(sx + 5.5 * u, sy - postH - 7 * u);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function draw3DSnowman(prop, alpha, isPaper) {
      if (alpha <= 0.01 || prop.depth <= 35) return;
      const u = prop.scale;
      if (u < 0.08) return;
      const sx = prop.sx, sy = prop.sy;
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = alpha;

      const snowBody = isPaper ? '#fffdf7' : '#edf6ff';
      const snowRim  = isPaper ? 'rgba(130,115,98,0.4)' : 'rgba(145,182,226,0.45)';
      ctx.fillStyle = snowBody;
      ctx.strokeStyle = snowRim;
      ctx.lineWidth = Math.max(0.8, 1.0 * u);

      // 下雪球 + 上头部
      ctx.beginPath();
      ctx.arc(sx, sy - 6 * u, 8.5 * u, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.arc(sx, sy - 17 * u, 6 * u, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();

      // 红围巾
      ctx.fillStyle = '#d94e5a';
      ctx.beginPath();
      ctx.roundRect(sx - 5.8 * u, sy - 12.6 * u, 11.6 * u, 3.2 * u, 1.5 * u);
      ctx.fill();
      ctx.fillRect(sx + 2 * u, sy - 10.5 * u, 2.8 * u, 5.5 * u);

      // 胡萝卜鼻子与小礼帽
      ctx.fillStyle = '#ff8a3d';
      ctx.beginPath();
      ctx.moveTo(sx, sy - 17.5 * u);
      ctx.lineTo(sx + 5.2 * u, sy - 16.5 * u);
      ctx.lineTo(sx, sy - 15.8 * u);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#242936';
      ctx.fillRect(sx - 6.5 * u, sy - 22.8 * u, 13 * u, 2 * u);
      ctx.fillRect(sx - 4.2 * u, sy - 28.5 * u, 8.4 * u, 6 * u);
      ctx.restore();
    }

    function getSnowGlobeProjection(fov, cx, cy, sinP, cosP) {
      const gPy = 12 - panY;
      const gDepth = Math.max(40, gPy * sinP + camDist);
      const gScale = fov / gDepth;
      return {
        gDepth,
        gScale,
        gx: cx,
        gy: cy - (gPy * cosP) * gScale,
        radius: 284 * gScale
      };
    }

    function buildGlobeDiorama(fov, cx, cy, cosY, sinY, cosP, sinP) {
      const props = [
        { type: 'chalet', wx: -154, wy: -132, wz: 64,   localYaw: 0.36 },
        { type: 'pine',   wx: -98,  wy: -132, wz: -138, sizeScale: 1.15 },
        { type: 'pine',   wx: 158,  wy: -132, wz: -52,  sizeScale: 1.05 },
        { type: 'pine',   wx: 122,  wy: -132, wz: 112,  sizeScale: 0.90 },
        { type: 'lamp',   wx: 120,  wy: -132, wz: 58 },
        { type: 'snowman',wx: -92,  wy: -132, wz: 132 }
      ];
      for (const p of props) {
        const proj = projectGlobeWorld(p.wx, p.wy, p.wz, cosY, sinY, cosP, sinP, fov, cx, cy);
        p.sx = proj.sx;
        p.sy = proj.sy;
        p.depth = proj.depth;
        p.scale = proj.scale;
      }
      props.sort((a, b) => b.depth - a.depth);
      return props;
    }

    function drawDioramaSubset(props, filterFn, alpha, timeSec, isPaper, cosY, sinY, cosP, sinP, fov, cx, cy) {
      for (const p of props) {
        if (!filterFn(p)) continue;
        if (p.type === 'chalet') draw3DAlpineChalet(p, alpha, timeSec, isPaper, cosY, sinY, cosP, sinP, fov, cx, cy);
        else if (p.type === 'pine') draw3DMiniPine(p, alpha, isPaper);
        else if (p.type === 'lamp') draw3DStreetLamp(p, alpha, timeSec, isPaper);
        else if (p.type === 'snowman') draw3DSnowman(p, alpha, isPaper);
      }
    }

    function drawSnowGlobePedestal(alpha, gx, gy, radius, effPitch, isPaper) {
      const baseTopY = gy + radius * 0.86;
      const baseH = radius * 0.34;
      const rxTop = radius * 0.58;
      const rxBot = radius * 0.80;
      const ellipRatio = Math.max(0.14, Math.min(0.26, 0.15 - Math.sin(effPitch) * 0.16));

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = alpha;

      const woodGrad = ctx.createLinearGradient(gx - rxBot, baseTopY, gx + rxBot, baseTopY);
      if (isPaper) {
        woodGrad.addColorStop(0, '#4f3321');
        woodGrad.addColorStop(0.28, '#8a5d3e');
        woodGrad.addColorStop(0.52, '#a3714d');
        woodGrad.addColorStop(0.80, '#6e4930');
        woodGrad.addColorStop(1, '#442b1b');
      } else {
        woodGrad.addColorStop(0, '#120b0c');
        woodGrad.addColorStop(0.24, '#3d221b');
        woodGrad.addColorStop(0.48, '#5f372a');
        woodGrad.addColorStop(0.76, '#311b17');
        woodGrad.addColorStop(1, '#10090b');
      }

      // 主木质弧形束腰（盖住玻璃球下端收口与多余地面散点）
      ctx.fillStyle = woodGrad;
      ctx.beginPath();
      ctx.moveTo(gx - rxTop, baseTopY);
      ctx.lineTo(gx + rxTop, baseTopY);
      ctx.bezierCurveTo(
        gx + rxTop * 0.96, baseTopY + baseH * 0.34,
        gx + rxBot * 0.96, baseTopY + baseH * 0.70,
        gx + rxBot, baseTopY + baseH * 0.90
      );
      ctx.ellipse(gx, baseTopY + baseH * 0.90, rxBot, rxBot * ellipRatio * 0.72, 0, 0, Math.PI, false);
      ctx.bezierCurveTo(
        gx - rxBot * 0.96, baseTopY + baseH * 0.70,
        gx - rxTop * 0.96, baseTopY + baseH * 0.34,
        gx - rxTop, baseTopY
      );
      ctx.closePath();
      ctx.fill();

      // 底部阶梯式古铜包边底座脚
      const brassGrad = ctx.createLinearGradient(gx - rxBot, baseTopY, gx + rxBot, baseTopY);
      brassGrad.addColorStop(0, '#6d4e1e');
      brassGrad.addColorStop(0.26, '#cfa14b');
      brassGrad.addColorStop(0.48, '#ffe094');
      brassGrad.addColorStop(0.75, '#be8c3a');
      brassGrad.addColorStop(1, '#614418');
      ctx.fillStyle = brassGrad;
      ctx.beginPath();
      ctx.ellipse(gx, baseTopY + baseH * 0.92, rxBot * 1.03, rxBot * ellipRatio * 0.78, 0, 0, Math.PI, false);
      ctx.lineTo(gx - rxBot * 1.03, baseTopY + baseH * 0.84);
      ctx.ellipse(gx, baseTopY + baseH * 0.84, rxBot * 1.03, rxBot * ellipRatio * 0.74, 0, Math.PI, 0, true);
      ctx.closePath();
      ctx.fill();

      // 上层承托玻璃球底沿的鎏金弧面领环 + 金珠饰边
      ctx.fillStyle = brassGrad;
      ctx.beginPath();
      ctx.ellipse(gx, baseTopY + baseH * 0.04, rxTop * 1.04, rxTop * ellipRatio * 0.74, 0, 0, Math.PI, false);
      ctx.lineTo(gx - rxTop * 1.02, baseTopY - baseH * 0.03);
      ctx.ellipse(gx, baseTopY - baseH * 0.03, rxTop * 1.02, rxTop * ellipRatio * 0.68, 0, Math.PI, 0, true);
      ctx.closePath();
      ctx.fill();

      const beadCount = 15;
      const beadR = Math.max(1.2, radius * 0.0135);
      for (let i = 0; i < beadCount; i++) {
        const ang = (i / (beadCount - 1)) * Math.PI;
        const bx = gx - Math.cos(ang) * (rxTop * 0.98);
        const by = baseTopY + baseH * 0.015 + Math.sin(ang) * (rxTop * ellipRatio * 0.68);
        ctx.fillStyle = '#ffebb3';
        ctx.beginPath();
        ctx.arc(bx, by, beadR, 0, Math.PI * 2);
        ctx.fill();
      }

      // 底座正面带铆钉的鎏金铭牌（自适应字号严格留在铆钉内侧，零穿模重叠）
      const plateW = Math.min(rxBot * 1.16, radius * 0.76);
      const plateH = baseH * 0.32;
      const plateY = baseTopY + baseH * 0.50;
      ctx.fillStyle = brassGrad;
      ctx.beginPath();
      ctx.roundRect(gx - plateW * 0.5, plateY - plateH * 0.5, plateW, plateH, Math.max(2, plateH * 0.28));
      ctx.fill();
      ctx.strokeStyle = 'rgba(72, 46, 16, 0.55)';
      ctx.lineWidth = Math.max(0.7, radius * 0.004);
      ctx.stroke();

      if (plateH >= 8) {
        const rivR = Math.max(1, plateH * 0.085);
        ctx.fillStyle = '#5c3c12';
        ctx.beginPath();
        ctx.arc(gx - plateW * 0.445, plateY, rivR, 0, Math.PI * 2);
        ctx.arc(gx + plateW * 0.445, plateY, rivR, 0, Math.PI * 2);
        ctx.fill();

        const label = 'MERRY CHRISTMAS';
        let fontPx = Math.max(6.5, plateH * 0.46);
        ctx.font = `600 ${fontPx.toFixed(1)}px "Inter", "PingFang SC", sans-serif`;
        const measured = ctx.measureText(label).width;
        const maxLabelW = plateW * 0.74;
        if (measured > maxLabelW && measured > 0) {
          fontPx *= maxLabelW / measured;
          ctx.font = `600 ${fontPx.toFixed(1)}px "Inter", "PingFang SC", sans-serif`;
        }
        ctx.fillStyle = '#241608';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, gx, plateY + 0.5);
      }

      ctx.restore();
    }

    function renderSnowGlobeBack(g, globe, diorama, effPitch, timeSec, isPaper, cosY, sinY, cosP, sinP, fov, cx, cy) {
      if (g <= 0.008) return;
      const alpha = easeOutCubic(Math.min(1, g * 1.15));
      const { gx, gy, radius } = globe;
      const baseTopY = gy + radius * 0.86;
      const baseH = radius * 0.34;
      const rxBot = radius * 0.80;

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';

      // 0. 移轴桌面平面与远处暖色散景氛围光斑
      if (viewW && viewH) {
        const tableY = baseTopY + baseH * 0.62;
        const tableGrad = ctx.createLinearGradient(0, tableY, 0, viewH);
        if (isPaper) {
          tableGrad.addColorStop(0, `rgba(218, 206, 184, ${0.0})`);
          tableGrad.addColorStop(0.28, `rgba(214, 200, 176, ${0.42 * alpha})`);
          tableGrad.addColorStop(1, `rgba(186, 170, 146, ${0.68 * alpha})`);
        } else {
          tableGrad.addColorStop(0, 'rgba(10, 14, 26, 0)');
          tableGrad.addColorStop(0.24, `rgba(14, 18, 32, ${0.52 * alpha})`);
          tableGrad.addColorStop(1, `rgba(5, 7, 14, ${0.84 * alpha})`);
        }
        ctx.fillStyle = tableGrad;
        ctx.fillRect(0, tableY, viewW, viewH - tableY);
      }

      // 1. 底座阴影 + 穿过水晶球的折射散焦亮斑（Caustics）
      const floorY = baseTopY + baseH * 1.04;
      const shGrad = ctx.createRadialGradient(gx, floorY, radius * 0.15, gx, floorY, rxBot * 1.38);
      shGrad.addColorStop(0, isPaper ? `rgba(56, 44, 30, ${0.32 * alpha})` : `rgba(0, 2, 8, ${0.74 * alpha})`);
      shGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = shGrad;
      ctx.beginPath();
      ctx.ellipse(gx, floorY, rxBot * 1.38, baseH * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();

      const causX = gx + rxBot * 0.74;
      const causY = floorY + baseH * 0.08;
      const causGrad = ctx.createRadialGradient(causX, causY, 0, causX, causY, radius * 0.56);
      causGrad.addColorStop(0, isPaper ? `rgba(255, 244, 210, ${0.38 * alpha})` : `rgba(195, 232, 255, ${0.24 * alpha})`);
      causGrad.addColorStop(0.45, isPaper ? `rgba(242, 204, 132, ${0.18 * alpha})` : `rgba(255, 208, 128, ${0.12 * alpha})`);
      causGrad.addColorStop(1, 'rgba(255, 208, 128, 0)');
      ctx.fillStyle = causGrad;
      ctx.beginPath();
      ctx.ellipse(causX, causY, radius * 0.56, baseH * 0.24, 0.12, 0, Math.PI * 2);
      ctx.fill();

      // 2. 玻璃球体内腔透亮底色与多层次雪丘景深（裁剪在球内）
      ctx.save();
      ctx.beginPath();
      ctx.arc(gx, gy, radius, 0, Math.PI * 2);
      ctx.clip();

      const innerGrad = ctx.createRadialGradient(
        gx - radius * 0.28, gy - radius * 0.28, radius * 0.08,
        gx, gy, radius
      );
      if (isPaper) {
        innerGrad.addColorStop(0, `rgba(255, 253, 248, ${0.12 * alpha})`);
        innerGrad.addColorStop(0.76, `rgba(240, 232, 214, ${0.24 * alpha})`);
        innerGrad.addColorStop(1, `rgba(176, 158, 128, ${0.40 * alpha})`);
      } else {
        innerGrad.addColorStop(0, `rgba(165, 214, 255, ${0.03 * alpha})`);
        innerGrad.addColorStop(0.72, `rgba(98, 168, 245, ${0.10 * alpha})`);
        innerGrad.addColorStop(0.92, `rgba(170, 220, 255, ${0.20 * alpha})`);
        innerGrad.addColorStop(1, `rgba(225, 245, 255, ${0.32 * alpha})`);
      }
      ctx.fillStyle = innerGrad;
      ctx.fillRect(gx - radius, gy - radius, radius * 2, radius * 2);

      const farHillY = gy + radius * 0.48;
      ctx.fillStyle = isPaper ? `rgba(218, 208, 190, ${0.55 * alpha})` : `rgba(38, 62, 102, ${0.48 * alpha})`;
      ctx.beginPath();
      ctx.moveTo(gx - radius, farHillY + radius * 0.08);
      ctx.quadraticCurveTo(gx - radius * 0.42, farHillY - radius * 0.16, gx - radius * 0.05, farHillY - radius * 0.02);
      ctx.quadraticCurveTo(gx + radius * 0.36, farHillY - radius * 0.18, gx + radius, farHillY + radius * 0.06);
      ctx.lineTo(gx + radius, gy + radius);
      ctx.lineTo(gx - radius, gy + radius);
      ctx.closePath();
      ctx.fill();

      const snowTopY = gy + radius * 0.56;
      const snowGrad = ctx.createLinearGradient(gx, snowTopY - radius * 0.10, gx, gy + radius);
      if (isPaper) {
        snowGrad.addColorStop(0, `rgba(255, 253, 246, ${0.94 * alpha})`);
        snowGrad.addColorStop(1, `rgba(226, 215, 194, ${0.98 * alpha})`);
      } else {
        snowGrad.addColorStop(0, `rgba(226, 241, 255, ${0.38 * alpha})`);
        snowGrad.addColorStop(0.45, `rgba(148, 184, 224, ${0.42 * alpha})`);
        snowGrad.addColorStop(1, `rgba(22, 34, 60, ${0.90 * alpha})`);
      }
      ctx.fillStyle = snowGrad;
      ctx.beginPath();
      ctx.moveTo(gx - radius, snowTopY + radius * 0.06);
      ctx.quadraticCurveTo(gx - radius * 0.36, snowTopY - radius * 0.11, gx, snowTopY + radius * 0.02);
      ctx.quadraticCurveTo(gx + radius * 0.36, snowTopY + radius * 0.11, gx + radius, snowTopY - radius * 0.03);
      ctx.lineTo(gx + radius, gy + radius);
      ctx.lineTo(gx - radius, gy + radius);
      ctx.closePath();
      ctx.fill();

      drawDioramaSubset(diorama, (p) => p.depth >= globe.gDepth, alpha, timeSec, isPaper, cosY, sinY, cosP, sinP, fov, cx, cy);
      ctx.restore();
      ctx.restore();
    }

    function renderSnowGlobeFront(g, globe, diorama, effPitch, timeSec, isPaper, cosY, sinY, cosP, sinP, fov, cx, cy) {
      if (g <= 0.008) return;
      const alpha = easeOutCubic(Math.min(1, g * 1.15));
      const { gx, gy, radius } = globe;

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.beginPath();
      ctx.arc(gx, gy, radius, 0, Math.PI * 2);
      ctx.clip();

      // 1. 树前方的微缩雪景建筑/松树/街灯/雪人
      drawDioramaSubset(diorama, (p) => p.depth < globe.gDepth, alpha, timeSec, isPaper, cosY, sinY, cosP, sinP, fov, cx, cy);

      // 2. 玻璃球内悬浮的微细金箔亮片（Glitter）
      if (!isPaper) ctx.globalCompositeOperation = 'lighter';
      for (const gl of globeGlitter) {
        const a = gl.ang + timeSec * gl.speed;
        const gxPos = Math.cos(a) * gl.rad;
        const gzPos = Math.sin(a) * gl.rad;
        const gyPos = gl.y + Math.sin(timeSec * 1.4 + gl.bobPhase) * 9;
        const proj = projectGlobeWorld(gxPos, gyPos, gzPos, cosY, sinY, cosP, sinP, fov, cx, cy);
        const tw = 0.45 + 0.55 * Math.sin(timeSec * 3.8 + gl.bobPhase);
        ctx.globalAlpha = alpha * tw * (isPaper ? 0.42 : 0.72);
        ctx.fillStyle = gl.warm ? '#ffe18f' : '#dff2ff';
        ctx.beginPath();
        ctx.arc(proj.sx, proj.sy, Math.max(0.9, gl.size * proj.scale * 0.55), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;

      // 3. 厚玻璃外壳边缘色散折射环（Refraction Rim）
      const rimGrad = ctx.createRadialGradient(gx, gy, radius * 0.87, gx, gy, radius);
      if (isPaper) {
        rimGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
        rimGrad.addColorStop(0.65, `rgba(215, 200, 174, ${0.18 * alpha})`);
        rimGrad.addColorStop(1, `rgba(128, 108, 84, ${0.34 * alpha})`);
      } else {
        rimGrad.addColorStop(0, 'rgba(180, 224, 255, 0)');
        rimGrad.addColorStop(0.55, `rgba(130, 198, 255, ${0.13 * alpha})`);
        rimGrad.addColorStop(0.86, `rgba(218, 244, 255, ${0.26 * alpha})`);
        rimGrad.addColorStop(1, `rgba(255, 226, 175, ${0.24 * alpha})`);
      }
      ctx.fillStyle = rimGrad;
      ctx.fillRect(gx - radius, gy - radius, radius * 2, radius * 2);

      // 4. 球面曲率影棚柔光窗格倒影（上左柔和十字窗格高光）
      ctx.save();
      ctx.translate(gx - radius * 0.44, gy - radius * 0.44);
      ctx.rotate(-0.62);
      const winRef = ctx.createLinearGradient(-radius * 0.24, 0, radius * 0.24, 0);
      const refBase = isPaper ? 0.34 : 0.23;
      winRef.addColorStop(0, `rgba(240, 250, 255, ${refBase * alpha})`);
      winRef.addColorStop(1, 'rgba(240, 250, 255, 0)');
      ctx.fillStyle = winRef;
      const pw = radius * 0.16, ph = radius * 0.24, gap = radius * 0.03;
      ctx.beginPath();
      ctx.roundRect(-pw - gap * 0.5, -ph - gap * 0.5, pw, ph, radius * 0.04);
      ctx.roundRect(gap * 0.5,       -ph - gap * 0.5, pw * 0.78, ph, radius * 0.04);
      ctx.roundRect(-pw - gap * 0.5, gap * 0.5,       pw, ph * 0.82, radius * 0.04);
      ctx.roundRect(gap * 0.5,       gap * 0.5,       pw * 0.78, ph * 0.82, radius * 0.04);
      ctx.fill();
      ctx.restore();

      // 5. 右下角暖金反射轮廓光
      ctx.strokeStyle = isPaper
        ? `rgba(242, 210, 152, ${0.42 * alpha})`
        : `rgba(255, 212, 138, ${0.34 * alpha})`;
      ctx.lineWidth = Math.max(1.5, radius * 0.016);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(gx, gy, radius * 0.94, Math.PI * 0.06, Math.PI * 0.32);
      ctx.stroke();

      // 底部玻璃封口微雾霜边
      const frostGrad = ctx.createLinearGradient(gx, gy + radius * 0.70, gx, gy + radius * 0.90);
      frostGrad.addColorStop(0, 'rgba(225, 242, 255, 0)');
      frostGrad.addColorStop(1, isPaper ? `rgba(255, 252, 244, ${0.34 * alpha})` : `rgba(205, 232, 255, ${0.24 * alpha})`);
      ctx.fillStyle = frostGrad;
      ctx.fillRect(gx - radius, gy + radius * 0.70, radius * 2, radius * 0.20);

      ctx.restore();

      // 玻璃外沿锐利勾光边（仅描到嵌入底座领口的两侧，不穿过底座正面）
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = isPaper
        ? `rgba(116, 94, 68, ${0.52 * alpha})`
        : `rgba(212, 238, 255, ${0.46 * alpha})`;
      ctx.lineWidth = Math.max(1.4, radius * 0.011);
      ctx.beginPath();
      ctx.arc(gx, gy, radius, Math.PI * 0.67, Math.PI * 2.33);
      ctx.stroke();
      ctx.restore();

      // 6. 最后绘制车削红木鎏金底座，让玻璃球底端物理嵌入底座杯口，彻底杜绝杂点/白边穿模！
      drawSnowGlobePedestal(alpha, gx, gy, radius, effPitch, isPaper);
    }

    function applyTiltShiftBlur(g, focusY, globeR, isPaper) {
      if (g <= 0.015 || !viewW || !viewH) return;
      const tw = Math.max(80, Math.floor(viewW * 0.14));
      const th = Math.max(60, Math.floor(viewH * 0.14));
      const bw = Math.max(160, Math.floor(viewW * 0.30));
      const bh = Math.max(120, Math.floor(viewH * 0.30));

      if (tiltTinyCanvas.width !== tw || tiltTinyCanvas.height !== th) {
        tiltTinyCanvas.width = tw;
        tiltTinyCanvas.height = th;
      }
      if (tiltBlurCanvas.width !== bw || tiltBlurCanvas.height !== bh) {
        tiltBlurCanvas.width = bw;
        tiltBlurCanvas.height = bh;
      }

      // 两级双线性降采样生成顺滑光学焦外散景
      tiltTinyCtx.clearRect(0, 0, tw, th);
      tiltTinyCtx.imageSmoothingEnabled = true;
      tiltTinyCtx.imageSmoothingQuality = 'high';
      tiltTinyCtx.drawImage(canvas, 0, 0, tw, th);

      tiltBlurCtx.save();
      tiltBlurCtx.globalCompositeOperation = 'source-over';
      tiltBlurCtx.clearRect(0, 0, bw, bh);
      tiltBlurCtx.imageSmoothingEnabled = true;
      tiltBlurCtx.imageSmoothingQuality = 'high';
      tiltBlurCtx.drawImage(tiltTinyCanvas, 0, 0, bw, bh);

      // 只保留上下焦外带，雪球屋与圣诞树主体处于清晰焦平面内
      tiltBlurCtx.globalCompositeOperation = 'destination-in';
      const focusTop = Math.max(0.05, Math.min(0.68, (focusY - globeR * 0.62) / viewH));
      const focusBot = Math.min(0.96, Math.max(focusTop + 0.16, (focusY + globeR * 0.78) / viewH));
      const maskGrad = tiltBlurCtx.createLinearGradient(0, 0, 0, bh);
      const blurStrength = Math.min(0.95, g * 0.94);
      maskGrad.addColorStop(0, `rgba(0, 0, 0, ${blurStrength})`);
      maskGrad.addColorStop(focusTop, 'rgba(0, 0, 0, 0)');
      maskGrad.addColorStop(focusBot, 'rgba(0, 0, 0, 0)');
      maskGrad.addColorStop(1, `rgba(0, 0, 0, ${blurStrength})`);
      tiltBlurCtx.fillStyle = maskGrad;
      tiltBlurCtx.fillRect(0, 0, bw, bh);
      tiltBlurCtx.restore();

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.drawImage(tiltBlurCanvas, 0, 0, viewW, viewH);

      // 移轴上下暗角景深压暗，突出雪球屋微缩质感
      const vigGrad = ctx.createLinearGradient(0, 0, 0, viewH);
      const edgeTint = isPaper
        ? `rgba(208, 196, 174, ${0.30 * g})`
        : `rgba(3, 5, 12, ${0.42 * g})`;
      vigGrad.addColorStop(0, edgeTint);
      vigGrad.addColorStop(focusTop, 'rgba(0, 0, 0, 0)');
      vigGrad.addColorStop(focusBot, 'rgba(0, 0, 0, 0)');
      vigGrad.addColorStop(1, edgeTint);
      ctx.fillStyle = vigGrad;
      ctx.fillRect(0, 0, viewW, viewH);
      ctx.restore();
    }

    function renderBurstEffects(dt, timeSec) {
      if (!burstEffects.length) return;
      ctx.globalCompositeOperation = 'source-over';
      for (let i = burstEffects.length - 1; i >= 0; i--) {
        const b = burstEffects[i];
        b.life -= dt * b.decay;
        if (b.life <= 0) {
          burstEffects.splice(i, 1);
          continue;
        }
        const damp = Math.pow(b.drag, dt * 60);
        b.vx *= damp;
        b.vy *= damp;
        b.vy += b.gravity * dt;
        const swayX = b.swayAmp ? Math.sin(timeSec * 5.2 + b.phase) * b.swayAmp * dt : 0;
        b.x += b.vx * dt + swayX;
        b.y += b.vy * dt;
        b.rot += b.vrot * dt;

        const scalePop = (b.life > 0.85) ? (1.0 - (b.life - 0.85) * 3.0) : (0.65 + 0.35 * b.life);
        const ratio = (b.size * Math.max(0.25, scalePop)) / b.sprite.baseFontPx;
        const dw = b.sprite.w * ratio;
        const dh = b.sprite.h * ratio;

        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, b.life * 1.25));
        ctx.translate(b.x, b.y);
        if (b.rot !== 0) ctx.rotate(b.rot);
        ctx.drawImage(b.sprite.canvas, -dw * 0.5, -dh * 0.5, dw, dh);
        ctx.restore();
      }
    }

    function animate(now) {
      resizeCanvas();
      const dt = Math.min(0.05, (now - prevTime) * 0.001);
      prevTime = now;
      const timeSec = now * 0.001;
      if (!firstSnowTime) firstSnowTime = timeSec;

      if (scenePhase === 'seeding') {
        phaseElapsed += dt;
      } else if (scenePhase === 'growing') {
        introElapsed += dt;
        if (!heroRevealed && introElapsed >= 1.48) {
          heroRevealed = true;
          if (heroOverlayEl) heroOverlayEl.classList.add('is-revealed');
        }
        if (introElapsed >= 2.08) {
          introComplete = true;
          scenePhase = 'ready';
          seedParticles.length = 0;
          risingParticles.length = 0;
          groundRipples.length = 0;
        }
      }

      if (scenePhase === 'growing' || scenePhase === 'ready') {
        if (!draggingLeft) {
          if (autoRotate) {
            velYaw += (-autoSpeed - velYaw) * Math.min(1, dt * (introComplete ? 2.4 : 2.1));
          } else {
            velYaw *= Math.pow(0.05, dt);
          }
          velPitch *= Math.pow(0.05, dt);
          yaw += velYaw * dt;
          pitch = Math.max(-0.55, Math.min(1.15, pitch + velPitch * dt));
        }
        if (introComplete) {
          globeProgress += (targetGlobe - globeProgress) * Math.min(1, dt * 6.8);
          if (Math.abs(targetGlobe - globeProgress) < 0.0005) globeProgress = targetGlobe;
          targetDist = 520 + 670 * globeProgress;
        }
        camDist += (targetDist - camDist) * Math.min(1, dt * (introComplete ? 9.5 : 3.4));
      }

      const theme = THEMES[currentThemeIdx];
      const isPaper = theme.paper;

      // 0. 一次性拷贝离屏背景缓存（极速清屏）
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.drawImage(bgCanvas, 0, 0, viewW, viewH);

      const effPitch = getEffectivePitch();
      const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
      const cosP = Math.cos(effPitch), sinP = Math.sin(effPitch);
      const { fov, cx, cy } = getTreeViewportLayout();
      const globe = getSnowGlobeProjection(fov, cx, cy, sinP, cosP);
      const diorama = globeProgress > 0.008 ? buildGlobeDiorama(fov, cx, cy, cosY, sinY, cosP, sinP) : null;
      const snowOpenAlpha = easeOutCubic(Math.min(1, (timeSec - firstSnowTime) / 0.75));
      mouseVx *= Math.pow(0.03, dt);
      mouseVy *= Math.pow(0.03, dt);
      const mSpd = Math.hypot(mouseVx, mouseVy);
      const hasMoveDir = mSpd > 28;
      const mxDir = hasMoveDir ? (mouseVx / mSpd) : 0;
      const myDir = hasMoveDir ? (mouseVy / mSpd) : 0;
      const mPerpX = -myDir;
      const mPerpY = mxDir;

      // 1. 绘制漫天强化 3D 飘雪（发光雪尘 + 立体雪花符号，含鼠标划过向两侧散开物理）
      if (!isPaper) ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < snowNodes.length; i++) {
        const s = snowNodes[i];
        s.y += s.vy * dt;
        s.x += (s.vx + Math.sin(timeSec * 1.15 + s.phase) * s.swayAmp) * dt;
        if (s.y < -300) {
          s.y = 360;
          s.x = rand(-540, 540);
          s.z = rand(-480, 480);
          s.pushX = s.pushY = s.pushVx = s.pushVy = 0;
        }
        if (s.x < -580) s.x = 580;
        if (s.x > 580) s.x = -580;

        const py = s.y - panY;
        const rx = s.x * cosY - s.z * sinY;
        const rz1 = s.x * sinY + s.z * cosY;
        const depth = py * sinP + rz1 * cosP + camDist;
        if (depth <= 25) continue;

        const scale = fov / depth;
        const sx = cx + rx * scale;
        const sy = cy - (py * cosP - rz1 * sinP) * scale;

        if (!prefersReducedMotion && mouseActive) {
          const curX = sx + s.pushX;
          const curY = sy + s.pushY;
          const dx = curX - mouseX;
          const dy = curY - mouseY;
          const dist = Math.hypot(dx, dy);
          const repelR = 132;
          if (dist < repelR) {
            const strength = 1 - dist / repelR;
            const rxNorm = dist > 1.5 ? (dx / dist) : ((i % 2 === 0) ? 1 : -1);
            const ryNorm = dist > 1.5 ? (dy / dist) : -0.25;
            let partX = rxNorm >= 0 ? 1 : -1;
            let partY = ryNorm * 0.35;
            if (hasMoveDir) {
              const sideSign = (dx * mPerpX + dy * mPerpY) >= 0 ? 1 : -1;
              partX = mPerpX * sideSign;
              partY = mPerpY * sideSign;
            }
            const force = 2900 * strength * strength;
            s.pushVx += (rxNorm * 0.65 + partX * 0.85) * force * dt;
            s.pushVy += (ryNorm * 0.65 + partY * 0.75) * force * dt;
          }
        }

        // 弹簧阻尼恢复：让被推开的雪花轻柔回落回原本雪幕
        s.pushVx += (-s.pushX * 2.1 - s.pushVx * 3.6) * dt;
        s.pushVy += (-s.pushY * 2.1 - s.pushVy * 3.6) * dt;
        s.pushX += s.pushVx * dt;
        s.pushY += s.pushVy * dt;
        const pushMag = Math.hypot(s.pushX, s.pushY);
        if (pushMag > 175) {
          const clampScale = 175 / pushMag;
          s.pushX *= clampScale;
          s.pushY *= clampScale;
        }

        const drawSnowX = sx + s.pushX;
        const drawSnowY = sy + s.pushY;
        const energyBoost = pushMag > 2 ? (1 + Math.min(0.28, pushMag * 0.0035)) : 1;
        const twinkle = 0.72 + 0.28 * Math.sin(timeSec * 3.2 + s.phase);
        const insideGlobe = globeProgress > 0.02
          ? (Math.hypot(drawSnowX - globe.gx, drawSnowY - globe.gy) <= globe.radius * 0.96)
          : true;
        const globeSnowFade = insideGlobe ? 1 : (1 - 0.72 * globeProgress);
        ctx.globalAlpha = Math.min(1, Math.max(0.18, Math.min(1.0, (460 / depth) * s.alphaBase * twinkle)) * (isPaper ? 0.68 : 0.96) * snowOpenAlpha * energyBoost * globeSnowFade);

        if (s.isFlake) {
          const ratio = (s.size * scale * 0.62) / s.sprite.baseFontPx;
          const dw = s.sprite.w * ratio;
          const dh = s.sprite.h * ratio;
          ctx.drawImage(s.sprite.canvas, drawSnowX - dw * 0.5, drawSnowY - dh * 0.5, dw, dh);
        } else {
          const diam = Math.max(3.2, s.size * scale * 0.92 * glowMultiplier);
          ctx.drawImage(s.dotSprite, drawSnowX - diam * 0.5, drawSnowY - diam * 0.5, diam, diam);
        }
      }

      // 纯雪开场提示阶段：仅渲染飘雪星空
      if (scenePhase === 'prompt') {
        ctx.globalCompositeOperation = 'source-over';
        canvas.style.cursor = 'default';
        requestAnimationFrame(animate);
        return;
      }

      // 雪球屋背层（微缩桌面、折射光斑、多层底座、球内雪山与树后立体雪景村落）
      if (diorama) renderSnowGlobeBack(globeProgress, globe, diorama, effPitch, timeSec, isPaper, cosY, sinY, cosP, sinP, fov, cx, cy);

      // 1.5 阶段 A/B 衔接：文字化为粒子钻入地面 + 地面入土光晕涟漪
      if (scenePhase === 'seeding' || groundRipples.length > 0) {
        if (!isPaper) ctx.globalCompositeOperation = 'lighter';
        const { gx, gy } = getTreeGroundScreenPos();
        let buriedNow = 0;

        for (let i = 0; i < seedParticles.length; i++) {
          const p = seedParticles[i];
          if (p.buried) {
            buriedNow++;
            continue;
          }
          const localT = phaseElapsed - p.delay;
          if (localT < 0) {
            ctx.globalAlpha = 0.92;
            const d = p.size * 1.1;
            ctx.drawImage(p.sprite, p.startX - d * 0.5, p.startY - d * 0.5, d, d);
            continue;
          }
          const burstEnd = 0.16;
          const bx = p.startX + p.driftX;
          const by = p.startY + p.driftY;
          if (localT < burstEnd) {
            const u = easeOutCubic(localT / burstEnd);
            p.x = p.startX + p.driftX * u;
            p.y = p.startY + p.driftY * u;
            p.alpha = 1;
          } else {
            const diveT = Math.min(1, (localT - burstEnd) / p.dur);
            const e = easeInCubic(diveT) * 0.65 + diveT * 0.35;
            const inv = 1 - e;
            const ctrlX = (bx + p.targetX) * 0.5 + p.ctrlOffsetX;
            const ctrlY = Math.min(by, p.targetY) + Math.abs(p.targetY - by) * 0.35;
            p.x = inv * inv * bx + 2 * inv * e * ctrlX + e * e * p.targetX;
            p.y = inv * inv * by + 2 * inv * e * ctrlY + e * e * p.targetY;
            p.alpha = diveT > 0.82 ? Math.max(0, 1 - (diveT - 0.82) / 0.18) : 1;
            if (diveT >= 1) {
              p.buried = true;
              buriedNow++;
              if (groundRipples.length < 48 && Math.random() < 0.24) {
                groundRipples.push({
                  x: p.targetX,
                  y: p.targetY,
                  r: 3,
                  maxR: rand(26, 68),
                  life: 1.0,
                  decay: rand(1.15, 1.85)
                });
              }
              continue;
            }
          }
          ctx.globalAlpha = p.alpha * 0.96;
          const d = p.size * 1.8;
          ctx.drawImage(p.sprite, p.x - d * 0.5, p.y - d * 0.5, d, d);
        }

        // 地面汇入光斑随落土粒子逐渐亮起，并在成长阶段渐隐
        const buryRatio = seedParticles.length ? (buriedNow / seedParticles.length) : 1;
        const glowFade = (scenePhase === 'seeding')
          ? buryRatio
          : Math.max(0, 1 - introElapsed / 0.75);
        if (glowFade > 0.01) {
          const seedSprite = getDotSprite('#e8b86d', false);
          ctx.globalAlpha = 0.72 * glowFade;
          ctx.drawImage(seedSprite, gx - 90, gy - 32, 180, 64);
        }

        for (let i = groundRipples.length - 1; i >= 0; i--) {
          const rp = groundRipples[i];
          rp.life -= dt * rp.decay;
          if (rp.life <= 0) {
            groundRipples.splice(i, 1);
            continue;
          }
          const radius = rp.r + (rp.maxR - rp.r) * easeOutCubic(1 - rp.life);
          ctx.save();
          ctx.globalAlpha = rp.life * 0.55;
          ctx.strokeStyle = '#ffd98a';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.ellipse(rp.x, rp.y, radius, radius * 0.34, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        if (scenePhase === 'seeding' && (phaseElapsed >= 0.94 || (seedParticles.length > 0 && buriedNow === seedParticles.length && phaseElapsed >= 0.76))) {
          scenePhase = 'growing';
          introElapsed = 0;
          introComplete = false;
          introStarBurstDone = false;
          spawnRisingSpiritParticles();
        }

        if (scenePhase === 'seeding') {
          renderBurstEffects(dt, timeSec);
          ctx.globalCompositeOperation = 'source-over';
          canvas.style.cursor = 'default';
          requestAnimationFrame(animate);
          return;
        }
      }

      // 2. 绘制螺旋流光星尘与底部星环（全贴图 drawImage + 发光叠加）
      if (!isPaper) ctx.globalCompositeOperation = 'lighter';
      const gRot = -timeSec * 0.14;
      const cg = Math.cos(gRot), sg = Math.sin(gRot);

      for (let i = 0; i < sparkleNodes.length; i++) {
        const sp = sparkleNodes[i];
        let spIntroAlpha = 1;
        let spIntroScale = 1;
        if (!introComplete) {
          const spStart = sp.kind === 'ground' ? 0.02 : (0.10 + (sp.param || 0) * 1.06);
          const p = Math.max(0, Math.min(1, (introElapsed - spStart) / 0.36));
          if (p <= 0) continue;
          spIntroAlpha = easeOutCubic(p);
          spIntroScale = 0.35 + 0.65 * easeOutBack(p);
        }

        let px = sp.x, py = sp.y, pz = sp.z;
        if (sp.kind === 'ground') {
          px = sp.x * cg - sp.z * sg;
          pz = sp.x * sg + sp.z * cg;
          py += Math.sin(sp.param * 28 - timeSec * 2.5) * 1.8;
        }
        py -= panY;
        const rx = px * cosY - pz * sinY;
        const rz1 = px * sinY + pz * cosY;
        const depth = py * sinP + rz1 * cosP + camDist;
        if (depth <= 25) continue;

        const scale = fov / depth;
        const sx = cx + rx * scale;
        const sy = cy - (py * cosP - rz1 * sinP) * scale;

        let twinkle = 0.62 + 0.38 * Math.sin(timeSec * 3.8 + sp.phase);
        if (sp.kind === 'ribbon') {
          twinkle *= 0.65 + 0.55 * Math.sin(sp.param * 20 - timeSec * 4.5);
        }
        const diam = Math.max(2.5, sp.size * scale * 0.65 * glowMultiplier) * spIntroScale;
        ctx.globalAlpha = Math.min(1, (360 / depth) * twinkle * (isPaper ? 0.45 : 0.75) * glowMultiplier) * spIntroAlpha;
        ctx.drawImage(sp.sprite, sx - diam * 0.5, sy - diam * 0.5, diam, diam);
      }

      // 2.5 阶段 B：从地面破土飞升、沿树体螺旋向上聚合成树的发光尾迹粒子
      if (scenePhase === 'growing' && risingParticles.length > 0) {
        if (!isPaper) ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < risingParticles.length; i++) {
          const rp = risingParticles[i];
          const u = (introElapsed - rp.delay) / rp.dur;
          if (u <= 0 || u >= 1.12) continue;

          for (let k = 3; k >= 0; k--) {
            const uk = Math.max(0, Math.min(1, u - k * 0.032));
            const e = easeOutCubic(uk);
            const yy = -132 + e * 336;
            const rr = (1 - e) * 192 + 8 + rp.radialJitter * (1 - e * 0.7);
            const ang = rp.branch + e * 4.8 * Math.PI * 2 + rp.angleOffset;
            const px = Math.cos(ang) * rr;
            const pz = Math.sin(ang) * rr;
            const py = yy - panY;
            const rx = px * cosY - pz * sinY;
            const rz1 = px * sinY + pz * cosY;
            const depth = py * sinP + rz1 * cosP + camDist;
            if (depth <= 25) continue;
            const scale = fov / depth;
            const sx = cx + rx * scale;
            const sy = cy - (py * cosP - rz1 * sinP) * scale;
            const fadeOut = u > 0.85 ? Math.max(0, 1 - (u - 0.85) / 0.27) : 1;
            const tailWeight = 1 - k * 0.24;
            const d = rp.size * scale * 1.45 * tailWeight;
            ctx.globalAlpha = 0.88 * tailWeight * fadeOut;
            ctx.drawImage(rp.sprite, sx - d * 0.5, sy - d * 0.5, d, d);
          }
        }
      }

      ctx.globalCompositeOperation = 'source-over';

      // 3. 投影并排序 3D 颜文字与树上悬挂贺卡节点
      renderQueue.length = 0;
      const hRot = timeSec * 0.9;
      const ch = Math.cos(hRot), sh = Math.sin(hRot);
      let hoveringAnyCard = false;

      for (let i = 0; i < treeNodes.length; i++) {
        const n = treeNodes[i];
        if (n.type === 'kaomoji') {
          n.blinkTimer -= dt;
          if (n.blinkTimer <= 0) {
            n.blinking = !n.blinking;
            n.blinkTimer = n.blinking ? rand(0.18, 0.35) : rand(2.2, 6.2);
          }
          if (n.bounce > 0) n.bounce = Math.max(0, n.bounce - dt * 2.8);
        } else if (n.type === 'cardOrnament') {
          if (n.bounce > 0) n.bounce = Math.max(0, n.bounce - dt * 2.2);
        }

        let x = n.x, y = n.y, z = n.z;
        if (n.type === 'kaomoji') {
          y += Math.sin(timeSec * 2.4 + n.phase) * 2.2 + Math.sin(n.bounce * Math.PI) * 10;
        } else if (n.type === 'cardOrnament') {
          y += Math.sin(timeSec * 2.0 + n.phase) * 2.8 + Math.sin(n.bounce * Math.PI) * 14;
        } else if (n.type === 'starHalo') {
          x = n.x * ch - n.z * sh;
          z = n.x * sh + n.z * ch;
        }

        const py = y - panY;
        const rx = x * cosY - z * sinY;
        const rz1 = x * sinY + z * cosY;
        const depth = py * sinP + rz1 * cosP + camDist;
        if (depth <= 25) continue;

        const scale = fov / depth;
        const sx = cx + rx * scale;
        const sy = cy - (py * cosP - rz1 * sinP) * scale;

        if (scenePhase === 'ready') {
          if (n.type === 'kaomoji' && !draggingLeft) {
            const dxm = sx - mouseX, dym = sy - mouseY;
            if (dxm * dxm + dym * dym < 2300 && n.bounce < 0.2) {
              n.bounce = 0.85;
              n.blinking = true;
              n.blinkTimer = 0.35;
            }
          } else if (n.type === 'cardOrnament') {
            const hitR = Math.max(22, Math.min(42, 27 * scale * sizeMultiplier));
            const isHover = !draggingLeft && ((sx - mouseX) ** 2 + (sy - mouseY) ** 2 <= hitR * hitR);
            if (isHover) hoveringAnyCard = true;
            const targetHover = isHover ? 1.32 : 1.0;
            n.hoverScale += (targetHover - n.hoverScale) * Math.min(1, dt * 12);
          }
        }

        renderQueue.push({ node: n, sx, sy, depth, scale });
      }

      if (scenePhase !== 'ready') {
        canvas.style.cursor = 'default';
      } else if (!draggingLeft && !draggingRight) {
        canvas.style.cursor = hoveringAnyCard ? 'pointer' : 'grab';
      }

      renderQueue.sort((a, b) => b.depth - a.depth);

      // 4. 绘制所有 3D 颜文字与树上悬挂贺卡（100% 预烘焙纹理 drawImage，丝滑满帧！）
      const rayAngles = [-0.45, 0, 0.45, Math.PI - 0.45, Math.PI, Math.PI + 0.45];

      for (let i = 0; i < renderQueue.length; i++) {
        const { node, sx, sy, depth, scale } = renderQueue[i];
        let introAlpha = 1;
        let introPop = 1;
        let drawX = sx;
        let drawY = sy;

        if (!introComplete) {
          let tStart = 0.12;
          let tDur = 0.42;
          if (node.type === 'topStar' || node.type === 'starHalo') {
            tStart = 1.08;
            tDur = 0.46;
          } else if (node.type === 'cardOrnament') {
            const hNorm = Math.max(0, Math.min(1, (node.y + 135) / 315));
            tStart = 1.22 + hNorm * 0.38;
            tDur = 0.42;
          } else {
            const hNorm = Math.max(0, Math.min(1, (node.y + 135) / 315));
            tStart = 0.12 + hNorm * 0.96;
            tDur = 0.42;
          }
          const p = Math.max(0, Math.min(1, (introElapsed - tStart) / tDur));
          if (p <= 0) continue;
          const introEase = easeOutCubic(p);
          introAlpha = introEase;
          introPop = easeOutBack(p);
          if (node.type === 'cardOrnament') {
            drawY = sy - (1 - introEase) * 14;
          } else if (node.type !== 'topStar') {
            drawX = cx + (sx - cx) * (0.68 + 0.32 * introEase);
            drawY = sy + (1 - introEase) * 20;
          }
        }

        const depthRatio = Math.max(0.18, Math.min(1.0, (camDist + 165 - depth) / 310 + 0.36));
        const targetPx = Math.max(8, node.fontSize * scale * sizeMultiplier * 0.72);
        const sp = node.blinking ? node.spriteB : node.spriteA;

        if (node.type === 'topStar') {
          if (!introStarBurstDone && introElapsed >= 1.12) {
            introStarBurstDone = true;
            spawnIntroStarBurst(drawX, drawY);
          }
          const pulse = 1 + 0.08 * Math.sin(timeSec * 4.2);
          const starSize = targetPx * pulse * (introComplete ? 1 : (0.12 + 0.88 * introPop));
          const ratio = starSize / sp.baseFontPx;
          const dw = sp.w * ratio;
          const dh = sp.h * ratio;

          ctx.globalAlpha = introAlpha;
          ctx.drawImage(sp.canvas, drawX - dw * 0.5, drawY - dh * 0.5, dw, dh);

          // 6 条手绘光芒短线（ミ ★ 彡）
          ctx.strokeStyle = theme.starColor;
          ctx.lineWidth = Math.max(1.8, starSize * 0.08);
          ctx.lineCap = 'round';
          const rInner = starSize * 0.62;
          const rOuter = starSize * (0.94 + 0.1 * Math.sin(timeSec * 5.0));
          ctx.beginPath();
          for (let r = 0; r < 6; r++) {
            const a = rayAngles[r];
            const ca = Math.cos(a), sa = Math.sin(a);
            ctx.moveTo(drawX + ca * rInner, drawY + sa * rInner);
            ctx.lineTo(drawX + ca * rOuter, drawY + sa * rOuter);
          }
          ctx.stroke();
          continue;
        }

        if (node.type === 'cardOrnament') {
          // 树上悬挂的 3D 极简手绘贺卡（带轻柔钟摆微晃 + 悬停放大）
          const swing = Math.sin(timeSec * 2.2 + node.phase) * 0.14;
          const popScale = introComplete ? 1 : (0.18 + 0.82 * introPop);
          const cardScale = (targetPx * node.hoverScale * popScale) / sp.baseFontPx;
          const dw = sp.w * cardScale;
          const dh = sp.h * cardScale;

          ctx.save();
          ctx.globalAlpha = (isPaper
            ? (0.40 + depthRatio * 0.60)
            : (0.35 + depthRatio * 0.65)) * introAlpha;
          ctx.translate(drawX, drawY);
          ctx.rotate(swing);
          ctx.drawImage(sp.canvas, -dw * 0.5, -dh * 0.5, dw, dh);
          ctx.restore();
          continue;
        }

        const popScale = introComplete ? 1 : (0.24 + 0.76 * introPop);
        const ratio = (targetPx * popScale) / sp.baseFontPx;
        const dw = sp.w * ratio;
        const dh = sp.h * ratio;

        ctx.globalAlpha = ((node.type === 'trunkText')
          ? 0.96
          : (isPaper ? (0.28 + depthRatio * 0.72) : (0.22 + depthRatio * 0.78))) * introAlpha;

        ctx.drawImage(sp.canvas, drawX - dw * 0.5, drawY - dh * 0.5, dw, dh);
      }

      // 雪球屋前层（前置雪景村落、悬浮金箔微粒与折射窗格玻璃罩）
      if (diorama) renderSnowGlobeFront(globeProgress, globe, diorama, effPitch, timeSec, isPaper, cosY, sinY, cosP, sinP, fov, cx, cy);

      // 移轴景深微缩虚化（上下渐进光学虚化带，雪球屋主体保持锐利）
      applyTiltShiftBlur(globeProgress, globe.gy, globe.radius, isPaper);

      // 5. 渲染点击粒子特效
      renderBurstEffects(dt, timeSec);

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    // =========================================================================
    // React Bits 交互动效模块（零外部依赖原生移植：Magnet / StarBorder / TiltedCard）
    // =========================================================================
    (() => {
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) return;

      // 1. React Bits Magnet（对标官方 magnetStrength≈2 / padding≈100 强磁吸弹簧交互，基于静止锚点避免反馈抖动）
      const magnetNodes = [];
      const magnetTargets = [
        { el: document.getElementById('plantBtnWrap'), padding: 115, strength: 2.0, maxOffset: 20 },
        { el: document.getElementById('starBorderWrap'), padding: 80, strength: 2.6, maxOffset: 14 }
      ].filter((item) => item.el);

      let ptrX = -9999, ptrY = -9999, ptrActive = false;

      magnetTargets.forEach((cfg) => {
        magnetNodes.push({
          ...cfg,
          x: 0, y: 0, vx: 0, vy: 0,
          raf: 0, last: 0
        });
      });

      const smoothstep = (e0, e1, v) => {
        const t = Math.min(1, Math.max(0, (v - e0) / (e1 - e0)));
        return t * t * (3 - 2 * t);
      };

      function stepMagnet(m, now) {
        m.raf = 0;
        if (!m.el.isConnected) return;
        const dt = m.last ? Math.min((now - m.last) / 1000, 1 / 30) : 1 / 60;
        m.last = now;

        let tx = 0, ty = 0;
        if (ptrActive && !draggingLeft && !draggingRight) {
          const rect = m.el.getBoundingClientRect();
          if (rect.width > 0 && rect.height > 0) {
            const restCx = rect.left + rect.width * 0.5 - m.x;
            const restCy = rect.top + rect.height * 0.5 - m.y;
            const dx = ptrX - restCx;
            const dy = ptrY - restCy;
            const outside = Math.hypot(
              Math.max(0, Math.abs(dx) - rect.width * 0.5),
              Math.max(0, Math.abs(dy) - rect.height * 0.5)
            );
            if (outside <= m.padding) {
              const pull = 1 - smoothstep(m.padding * 0.45, m.padding, outside);
              tx = (dx / m.strength) * pull;
              ty = (dy / m.strength) * pull;
              const len = Math.hypot(tx, ty);
              if (len > m.maxOffset) {
                tx *= m.maxOffset / len;
                ty *= m.maxOffset / len;
              }
            }
          }
        }

        const stiffness = 170, damping = 16;
        const fx = stiffness * (tx - m.x) - damping * m.vx;
        const fy = stiffness * (ty - m.y) - damping * m.vy;
        m.vx += fx * dt;
        m.vy += fy * dt;
        m.x += m.vx * dt;
        m.y += m.vy * dt;

        m.el.style.setProperty('--mag-x', `${m.x.toFixed(2)}px`);
        m.el.style.setProperty('--mag-y', `${m.y.toFixed(2)}px`);

        const resting = Math.abs(tx - m.x) < 0.04 && Math.abs(ty - m.y) < 0.04 &&
                        Math.abs(m.vx) < 0.05 && Math.abs(m.vy) < 0.05;
        if (resting) {
          m.x = tx; m.y = ty; m.vx = 0; m.vy = 0;
          m.el.style.setProperty('--mag-x', `${tx.toFixed(2)}px`);
          m.el.style.setProperty('--mag-y', `${ty.toFixed(2)}px`);
          m.last = 0;
        } else {
          m.raf = requestAnimationFrame((t) => stepMagnet(m, t));
        }
      }

      window.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'touch') return;
        ptrX = e.clientX;
        ptrY = e.clientY;
        ptrActive = true;
        for (const m of magnetNodes) {
          if (!m.raf) m.raf = requestAnimationFrame((t) => stepMagnet(m, t));
        }
      }, { passive: true });

      document.documentElement.addEventListener('pointerleave', () => {
        ptrActive = false;
        for (const m of magnetNodes) {
          if (!m.raf) m.raf = requestAnimationFrame((t) => stepMagnet(m, t));
        }
      });

      // 2. React Bits StarBorder（共用于「种下」胶囊按钮与「写一张贺卡挂上树」主按钮）
      function attachStarBorder(starBtn, starCanvas, getRadius) {
        if (!starBtn || !starCanvas) return;
        const sctx = starCanvas.getContext('2d');
        const BLEED = 22;
        let phase = Math.random() * 120;
        let speedBoost = 0;
        let hovered = false;
        let lastT = performance.now();
        const dust = [];
        let emitAcc = 0;

        function buildOutline(w, h, r) {
          const cr = Math.min(r, w / 2, h / 2);
          const arc = (Math.PI * cr) / 2;
          const across = Math.max(0, w - 2 * cr);
          const down = Math.max(0, h - 2 * cr);
          const segs = [
            { len: across, x: cr, y: 0, dx: 1, dy: 0, ang: null },
            { len: arc, x: w - cr, y: cr, dx: 0, dy: 0, ang: -Math.PI / 2 },
            { len: down, x: w, y: cr, dx: 0, dy: 1, ang: null },
            { len: arc, x: w - cr, y: h - cr, dx: 0, dy: 0, ang: 0 },
            { len: across, x: w - cr, y: h, dx: -1, dy: 0, ang: null },
            { len: arc, x: cr, y: h - cr, dx: 0, dy: 0, ang: Math.PI / 2 },
            { len: down, x: 0, y: h - cr, dx: 0, dy: -1, ang: null },
            { len: arc, x: cr, y: cr, dx: 0, dy: 0, ang: Math.PI }
          ];
          const total = segs.reduce((acc, s) => acc + s.len, 0) || 1;
          return { cr, segs, total };
        }

        function samplePoint(shape, dist) {
          let s = ((dist % shape.total) + shape.total) % shape.total;
          for (const seg of shape.segs) {
            if (seg.len > 0 && s <= seg.len) {
              if (seg.ang === null) {
                return { x: seg.x + seg.dx * s, y: seg.y + seg.dy * s, nx: seg.dy, ny: -seg.dx };
              }
              const a = seg.ang + s / shape.cr;
              const nx = Math.cos(a), ny = Math.sin(a);
              return { x: seg.x + nx * shape.cr, y: seg.y + ny * shape.cr, nx, ny };
            }
            s -= seg.len;
          }
          return { x: 0, y: 0, nx: 0, ny: -1 };
        }

        starBtn.addEventListener('pointerenter', () => { hovered = true; speedBoost = 1.0; });
        starBtn.addEventListener('pointerleave', () => { hovered = false; });

        function renderStarBorder(now) {
          if (!starBtn.isConnected) return;
          const dt = Math.min(0.05, (now - lastT) * 0.001);
          lastT = now;

          const rect = starBtn.getBoundingClientRect();
          const w = Math.max(1, Math.round(rect.width));
          const h = Math.max(1, Math.round(rect.height));
          const cw = w + BLEED * 2;
          const ch = h + BLEED * 2;
          const sdpr = Math.min(window.devicePixelRatio || 1, 2);

          if (starCanvas.width !== Math.floor(cw * sdpr) || starCanvas.height !== Math.floor(ch * sdpr)) {
            starCanvas.width = Math.floor(cw * sdpr);
            starCanvas.height = Math.floor(ch * sdpr);
          }

          sctx.setTransform(sdpr, 0, 0, sdpr, 0, 0);
          sctx.clearRect(0, 0, cw, ch);

          const radius = getRadius(w, h);
          const shape = buildOutline(w, h, radius);
          speedBoost += ((hovered ? 1.0 : 0.0) - speedBoost) * Math.min(1, dt * 6);
          const velocity = 82 + speedBoost * 190;
          phase += velocity * dt;

          const starRgb = '255, 240, 195';

          // 绘制两颗对称绕边游走的星光尾迹
          for (let starIdx = 0; starIdx < 2; starIdx++) {
            const baseDist = phase + starIdx * (shape.total * 0.5);
            const trailSteps = hovered ? 18 : 13;
            for (let k = trailSteps; k >= 0; k--) {
              const p = samplePoint(shape, baseDist - k * 3.2);
              const t = 1 - k / trailSteps;
              const alpha = (t * t) * (hovered ? 0.85 : 0.52);
              const r = 0.8 + t * (hovered ? 1.9 : 1.3);
              sctx.fillStyle = `rgba(${starRgb}, ${alpha.toFixed(3)})`;
              sctx.beginPath();
              sctx.arc(BLEED + p.x, BLEED + p.y, r, 0, Math.PI * 2);
              sctx.fill();
            }

            // 头部小星芒
            const head = samplePoint(shape, baseDist);
            const hx = BLEED + head.x;
            const hy = BLEED + head.y;
            const arm = hovered ? 5.2 : 3.6;
            sctx.strokeStyle = `rgba(${starRgb}, ${hovered ? 0.95 : 0.72})`;
            sctx.lineWidth = 1.1;
            sctx.beginPath();
            sctx.moveTo(hx - arm, hy); sctx.lineTo(hx + arm, hy);
            sctx.moveTo(hx, hy - arm); sctx.lineTo(hx, hy + arm);
            sctx.stroke();
          }

          // 悬停时沿边框逸出细小星尘
          if (hovered) {
            emitAcc += dt * 16;
            while (emitAcc > 1) {
              emitAcc -= 1;
              const p = samplePoint(shape, phase);
              dust.push({
                x: BLEED + p.x,
                y: BLEED + p.y,
                vx: p.nx * (12 + Math.random() * 24) + (Math.random() - 0.5) * 14,
                vy: p.ny * (12 + Math.random() * 24) - 8,
                age: 0,
                life: 0.4 + Math.random() * 0.35
              });
            }
          }

          for (let i = dust.length - 1; i >= 0; i--) {
            const d = dust[i];
            d.age += dt;
            if (d.age >= d.life) {
              dust.splice(i, 1);
              continue;
            }
            d.x += d.vx * dt;
            d.y += d.vy * dt;
            const a = (1 - d.age / d.life) * 0.75;
            sctx.fillStyle = `rgba(${starRgb}, ${a.toFixed(3)})`;
            sctx.beginPath();
            sctx.arc(d.x, d.y, 1.1, 0, Math.PI * 2);
            sctx.fill();
          }

          requestAnimationFrame(renderStarBorder);
        }

        requestAnimationFrame(renderStarBorder);
      }

      attachStarBorder(document.getElementById('btnPlantTree'), document.getElementById('plantStarCanvas'), (_, h) => h * 0.5);
      attachStarBorder(document.getElementById('btnWriteCard'), document.getElementById('starBorderCanvas'), () => 8);

      // 3. React Bits TiltedCard（打开信封后鼠标悬停 3D 视差倾斜 + 纸张镜面高光）
      const envStage = document.getElementById('envelopeStage');
      const envTilt  = document.getElementById('envelopeTiltLayer');
      if (envStage && envTilt) {
        let tx = 0, ty = 0, cxTilt = 0, cyTilt = 0;
        let gx = 50, gy = 50, cgx = 50, cgy = 50;
        let gOp = 0, cgOp = 0;
        let tiltRaf = 0;

        function stepTilt() {
          tiltRaf = 0;
          cxTilt += (tx - cxTilt) * 0.14;
          cyTilt += (ty - cyTilt) * 0.14;
          cgx += (gx - cgx) * 0.16;
          cgy += (gy - cgy) * 0.16;
          cgOp += (gOp - cgOp) * 0.14;

          envTilt.style.setProperty('--tilt-x', `${cxTilt.toFixed(2)}deg`);
          envTilt.style.setProperty('--tilt-y', `${cyTilt.toFixed(2)}deg`);
          envTilt.style.setProperty('--glare-x', `${cgx.toFixed(1)}%`);
          envTilt.style.setProperty('--glare-y', `${cgy.toFixed(1)}%`);
          envTilt.style.setProperty('--glare-op', cgOp.toFixed(3));

          const settled = Math.abs(tx - cxTilt) < 0.03 && Math.abs(ty - cyTilt) < 0.03 && Math.abs(gOp - cgOp) < 0.01;
          if (!settled) tiltRaf = requestAnimationFrame(stepTilt);
        }

        envStage.addEventListener('pointermove', (e) => {
          if (e.pointerType === 'touch' || !envelopeShell.classList.contains('is-opened')) return;
          const r = envStage.getBoundingClientRect();
          const nx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / Math.max(1, r.width)) * 2 - 1));
          const ny = Math.max(-1, Math.min(1, ((e.clientY - r.top) / Math.max(1, r.height)) * 2 - 1));
          tx = -ny * 6.5;
          ty = nx * 7.5;
          gx = ((nx + 1) * 0.5) * 100;
          gy = ((ny + 1) * 0.5) * 100;
          gOp = 1;
          if (!tiltRaf) tiltRaf = requestAnimationFrame(stepTilt);
        }, { passive: true });

        envStage.addEventListener('pointerleave', () => {
          tx = 0; ty = 0; gOp = 0;
          if (!tiltRaf) tiltRaf = requestAnimationFrame(stepTilt);
        });
      }
    })();

  </script>
</body>
</html>
