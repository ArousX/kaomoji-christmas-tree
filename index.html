    function hasSensitiveWord(text) {
      if (!text) return false;
      const raw = String(text).normalize('NFKC').toLowerCase().replace(/[\u200B-\u200F\uFEFF\u00AD]/g, '');
      let nfkc = '';
      for (const ch of raw) nfkc += CLIENT_TRAD_MAP[ch] || ch;
      const compact = nfkc.replace(/[\s~`!@#$%^&*()\-_=+[\]{}|\\;:'",.<>/?·•￥…—]+/g, '');
      for (const word of CLIENT_BLOCKED_ZH) {
        if (compact.includes(word)) return true;
      }
      const chars = Array.from(compact);
      for (const len of CLIENT_HASH_LENS) {
        if (chars.length < len) continue;
        for (let i = 0; i <= chars.length - len; i++) {
          if (CLIENT_SAFE_HASHES.has(clientSyncDigest16(chars.slice(i, i + len).join('')))) return true;
        }
      }
      const tokens = nfkc.match(/[a-z]{2,8}/g);
      if (tokens) {
        for (const tok of tokens) {
          if (CLIENT_ASCII_HASHES.has(clientSyncDigest16(tok))) return true;
        }
      }
      for (const re of CLIENT_BLOCKED_EN) {
        if (re.test(nfkc)) return true;
      }
      return false;
    }

    function validateTextFieldsClean(fields) {
      for (const [label, val] of fields) {
        if (hasSensitiveWord(val)) {
          return `${label}包含敏感或不当词汇，请修改后再试哦~`;
        }
      }
      return null;
    }

    async function syncCardsFromCloud() {
      if (!isCloudEnabled) return;
      try {
        const res = await fetch(`${apiBase}/api/cards?limit=80`, { method: 'GET' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const myIds = getMyCloudIds();
        const remoteCards = Array.isArray(data.cards) ? data.cards.map((c) => ({
          ...c,
          custom: true,
          mine: myIds.has(c.id)
        })) : [];
        // 最新的全网贺卡排在前面，同时保留内置 12 张保底
        allCards = [...remoteCards, ...DEFAULT_CARDS];
        mountAllCardsOnTree();
        bindSpritesForTheme();
        setCloudStatus('云端已同步 · 共享信箱');
      } catch (err) {
        console.warn('云端同步失败:', err);
        setCloudStatus('云端暂未连通 · 显示默认祝福');
      }
    }

    // 将一张祝福贺卡作为 3D 挂件节点挂到圣诞树上
    function createCardOrnamentNode(card, idx, total, forcedAngle = null) {
      const bottomY = -115;
      const topY = 175;
      const totalH = topY - bottomY;
      // 分布在树身中下至中上部（视觉最显眼、最好点击的位置）
      const t = (forcedAngle !== null)
        ? rand(0.24, 0.72)
        : (0.14 + ((idx + 0.5) / Math.max(1, total)) * 0.70);
      const radius = (1 - t) * 182 + 24;
      const angle = (forcedAngle !== null)
        ? forcedAngle
        : (idx * 2.39996 + 0.35); // 黄金角 360° 均匀错落悬挂

      return {
        type: 'cardOrnament',
        cardId: card.id,
        card,
        x: Math.cos(angle) * radius,
        y: bottomY + t * totalH,
        z: Math.sin(angle) * radius,
        fontSize: card.custom ? 30 : 26,
        colorIdx: idx % 7,
        phase: rand(0, Math.PI * 2),
        hoverScale: 1.0,
        bounce: (forcedAngle !== null) ? 1.0 : 0.0
      };
    }

    function mountAllCardsOnTree() {
      // 清除旧的挂卡节点后重新挂载
      for (let i = treeNodes.length - 1; i >= 0; i--) {
        if (treeNodes[i].type === 'cardOrnament') treeNodes.splice(i, 1);
      }
      // 树上最多同时展示 MAX_TREE_ORNAMENTS 个 3D 挂件以保障 60+ FPS，其余全部保留在「再抽一张」池中
      const visibleCards = allCards.slice(0, MAX_TREE_ORNAMENTS);
      visibleCards.forEach((card, idx) => {
        treeNodes.push(createCardOrnamentNode(card, idx, visibleCards.length));
      });
    }

    // 绑定当前主题对应的预渲染贴图指针，主循环中彻底消除 Map 查找与字符串拼接！
    function bindSpritesForTheme() {
      const theme = THEMES[currentThemeIdx];
      const isPaper = theme.paper;

      for (const n of treeNodes) {
        if (n.type === 'topStar') {
          n.spriteA = getTextSprite('★', theme.starColor, isPaper, 'normal');
          n.spriteB = n.spriteA;
        } else if (n.type === 'trunkText') {
          n.spriteA = getTextSprite(n.text, theme.trunkColor, isPaper, 'trunk');
          n.spriteB = n.spriteA;
        } else if (n.type === 'starHalo') {
          n.spriteA = getTextSprite(n.text, theme.starColor, isPaper, 'normal');
          n.spriteB = getTextSprite(n.altText, theme.starColor, isPaper, 'normal');
        } else if (n.type === 'cardOrnament') {
          const col = n.card.custom
            ? (isPaper ? '#c83e4d' : '#ffe07d')
            : theme.palette[(n.colorIdx + 1) % theme.palette.length];
          n.spriteA = getCardOrnamentSprite(n.card.style || 'gift', col, !!n.card.custom, isPaper);
          n.spriteB = n.spriteA;
        } else {
          const col = theme.palette[n.colorIdx % theme.palette.length];
          n.spriteA = getTextSprite(n.text, col, isPaper, 'normal');
          n.spriteB = getTextSprite(n.altText, col, isPaper, 'normal');
        }
      }

      for (const sp of sparkleNodes) {
        const col = (sp.kind === 'ribbon')
          ? (sp.colorIdx % 3 === 0 ? theme.ribbonColor : theme.palette[sp.colorIdx % theme.palette.length])
          : theme.groundPalette[sp.colorIdx % theme.groundPalette.length];
        sp.sprite = getDotSprite(col, isPaper);
      }

      const snowDot = getDotSprite(theme.snowColor, isPaper);
      for (const s of snowNodes) {
        if (s.isFlake) {
          s.sprite = getTextSprite(s.glyph, theme.snowColor, isPaper, 'normal');
        } else {
          s.dotSprite = snowDot;
        }
      }
    }

    buildKaomojiTree();
    loadCardsFromStorage();
    mountAllCardsOnTree();
    bindSpritesForTheme();
    syncCardsFromCloud();

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        textSpriteCache.clear();
        bindSpritesForTheme();
      });
    }

    // =========================================================================
    // 阶段式启动动效：纯雪开场 -> 文字化粉入地 -> 粒子飞升成树 -> 极简界面浮现
    // =========================================================================
    const prefersReducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const plantPromptEl  = document.getElementById('plantPromptOverlay');
    const plantSentenceEl = document.getElementById('plantSentence');
    const plantInputWrapEl = document.getElementById('plantInputWrap');
    const plantNameInput = document.getElementById('plantNameInput');
    const btnPlantTree   = document.getElementById('btnPlantTree');
    const heroOverlayEl  = document.getElementById('heroOverlay');
    const heroRecipientNameEl = document.getElementById('heroRecipientName');

    // scenePhase: 'prompt' | 'seeding' | 'growing' | 'ready'
    let scenePhase = 'prompt';
    let phaseElapsed = 0;
    let introElapsed = 0;
    let introComplete = false;
    let introStarBurstDone = false;
    let heroRevealed = false;

    const seedParticles = [];
    const risingParticles = [];
    const groundRipples = [];

    let yaw = prefersReducedMotion ? 0.0 : 0.72;
    let pitch = 0.08;
    let velYaw = prefersReducedMotion ? -0.35 : -1.45;
    let velPitch = 0.0;
    let camDist = prefersReducedMotion ? 520 : 680;
    let targetDist = 520;
    let targetGlobe = 0.0;   // 0 = 近景全屏树, 1 = 移轴微缩雪球屋
    let globeProgress = 0.0;
    let panX = 104;
    let panY = 18;

    function getEffectivePitch() {
      // 该坐标系中负 pitch 才是俯视视角，正 pitch 为仰视；推远进入移轴雪球屋时渐进向下俯视
      return Math.max(-0.68, Math.min(1.15, pitch - globeProgress * 0.38));
    }

    let autoRotate = true;
    let autoSpeed = 0.35;
    let sizeMultiplier = 1.05;
    let glowMultiplier = 1.15;

    let pointerDownLeft = false;
    let draggingLeft = false;
    let draggingRight = false;
    let pointerDownX = 0;
    let pointerDownY = 0;
    let lastX = 0;
    let lastY = 0;
    let mouseX = -9999;
    let mouseY = -9999;
    let mouseActive = false;
    let mouseVx = 0;
    let mouseVy = 0;
    let lastMoveX = -9999;
    let lastMoveY = -9999;
    let lastMoveTs = 0;

    function easeOutCubic(x) {
      return 1 - Math.pow(1 - x, 3);
    }

    function easeInCubic(x) {
      return x * x * x;
    }

    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    // 自适应输入框宽度，输入名字时句子始终紧凑居中
    const measureCtx = document.createElement('canvas').getContext('2d');
    function syncPlantInputWidth() {
      if (!plantNameInput) return;
      const val = plantNameInput.value;
      if (!val) {
        plantNameInput.style.width = '78px';
        return;
      }
      const cs = getComputedStyle(plantNameInput);
      measureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      const w = Math.ceil(measureCtx.measureText(val).width);
      plantNameInput.style.width = `${Math.max(78, Math.min(260, w + 26))}px`;
    }

    if (plantInputWrapEl && plantNameInput) {
      plantInputWrapEl.addEventListener('click', () => plantNameInput.focus());
      plantNameInput.addEventListener('input', syncPlantInputWidth);
      plantNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          startPlantingSequence();
        }
      });
      // 页面打开后自动聚焦输入框，方便直接键盘输入
      setTimeout(() => {
        if (scenePhase === 'prompt') plantNameInput.focus({ preventScroll: true });
      }, 120);
    }

    function getTreeViewportLayout() {
      const w = viewW || window.innerWidth || 1280;
      const h = viewH || window.innerHeight || 720;
      const isMobile = w <= 768;
      const ge = globeProgress;
      const fovScale = 1 + (isMobile ? 0.14 : 0.16) * ge;
      return {
        isMobile,
        fov: (isMobile ? Math.min(w * 1.14, h * 0.60) : Math.min(w, h) * 0.98) * fovScale,
        cx: isMobile
          ? (w * 0.49 + (panX - 104) * 0.6)
          : (w * 0.52 + panX * (1 - 0.12 * ge)),
        cy: isMobile
          ? (h * (0.62 - 0.08 * ge))
          : (h * (0.49 - 0.075 * ge))
      };
    }

    function getTreeGroundScreenPos() {
      const { fov, cx, cy } = getTreeViewportLayout();
      const effPitch = getEffectivePitch();
      const py = -132 - panY;
      const cosP = Math.cos(effPitch), sinP = Math.sin(effPitch);
      const depth = py * sinP + camDist;
      const scale = fov / Math.max(40, depth);
      return {
        gx: cx,
        gy: cy - (py * cosP) * scale
      };
    }

    function samplePromptParticles(recipient) {
      seedParticles.length = 0;
      const rowEl = document.getElementById('plantRow');
      const prefixEl = document.getElementById('plantPrefix');
      const suffixEl = document.getElementById('plantSuffix');
      if (!rowEl || !prefixEl || !suffixEl || !plantNameInput || !btnPlantTree) return;

      const { gx, gy } = getTreeGroundScreenPos();
      const rowRect = rowEl.getBoundingClientRect();
      const offW = Math.max(100, Math.ceil(rowRect.width + 20));
      const offH = Math.max(60, Math.ceil(rowRect.height + 20));
      const off = document.createElement('canvas');
      off.width = offW;
      off.height = offH;
      const octx = off.getContext('2d');
      octx.textBaseline = 'middle';
      octx.textAlign = 'center';

      const drawElText = (el, text, color) => {
        const r = el.getBoundingClientRect();
        const cs = getComputedStyle(el);
        octx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        octx.fillStyle = color;
        octx.fillText(text, r.left - rowRect.left + r.width * 0.5, r.top - rowRect.top + r.height * 0.5);
      };

      drawElText(prefixEl, '为', '#f3f5f8');
      if (recipient) {
        drawElText(plantNameInput, recipient, '#e8b86d');
      } else {
        // 未填写名字时将输入框亮线一起化粉
        const ir = plantInputWrapEl.getBoundingClientRect();
        octx.fillStyle = '#e8b86d';
        octx.fillRect(ir.left - rowRect.left + 8, ir.bottom - rowRect.top - 4, Math.max(24, ir.width - 16), 3);
      }
      drawElText(suffixEl, '种下圣诞树', '#f3f5f8');

      // 把「种下」按钮文字与外框微粒化
      const br = btnPlantTree.getBoundingClientRect();
      const bcs = getComputedStyle(btnPlantTree);
      octx.font = `${bcs.fontWeight} ${bcs.fontSize} ${bcs.fontFamily}`;
      octx.fillStyle = '#e8b86d';
      octx.fillText('种下', br.left - rowRect.left + br.width * 0.5, br.top - rowRect.top + br.height * 0.5);

      const img = octx.getImageData(0, 0, offW, offH).data;
      const pts = [];
      const step = 3;
      for (let y = 0; y < offH; y += step) {
        for (let x = 0; x < offW; x += step) {
          const idx = (y * offW + x) * 4;
          const a = img[idx + 3];
          if (a > 75) {
            const isGold = img[idx] > 215 && img[idx + 1] > 160 && img[idx + 2] < 150;
            pts.push({
              sx: rowRect.left + x,
              sy: rowRect.top + y,
              isGold
            });
          }
        }
      }

      // 均匀抽样到约 320 颗，保证全平台丝滑 60fps
      const maxCount = 320;
      const stride = Math.max(1, pts.length / maxCount);
      for (let f = 0; f < pts.length; f += stride) {
        const pt = pts[Math.floor(f)];
        const normX = Math.max(0, Math.min(1, (pt.sx - rowRect.left) / Math.max(1, rowRect.width)));
        const color = pt.isGold ? '#e8b86d' : (Math.random() < 0.35 ? '#ffe7a8' : '#f3f5f8');
        seedParticles.push({
          x: pt.sx,
          y: pt.sy,
          startX: pt.sx,
          startY: pt.sy,
          driftX: rand(-36, 36),
          driftY: rand(-38, 12),
          ctrlOffsetX: rand(-90, 90),
          targetX: gx + rand(-34, 34),
          targetY: gy + rand(-8, 10),
          delay: normX * 0.16 + rand(0, 0.06),
          dur: rand(0.56, 0.74),
          size: rand(3.2, 6.2),
          sprite: getDotSprite(color, false),
          buried: false,
          alpha: 1
        });
      }
    }

    function spawnRisingSpiritParticles() {
      risingParticles.length = 0;
      const theme = THEMES[currentThemeIdx];
      const total = 150;
      for (let i = 0; i < total; i++) {
        const branch = (i % 2 === 0) ? 0 : Math.PI;
        const col = (i % 4 === 0) ? theme.starColor : theme.palette[i % theme.palette.length];
        risingParticles.push({
          branch,
          angleOffset: rand(-0.35, 0.35),
          delay: (i / total) * 0.62 + rand(0, 0.08),
          dur: rand(0.82, 1.15),
          size: rand(4.0, 8.2),
          radialJitter: rand(-14, 14),
          sprite: getDotSprite(col, false)
        });
      }
    }

    function startPlantingSequence() {
      if (typeof window.__unlockBgm === 'function') window.__unlockBgm();
      if (scenePhase !== 'prompt') return;
      const recipient = (plantNameInput ? plantNameInput.value : '').trim();
      const badRecipientMsg = validateTextFieldsClean([['名字', recipient]]);
      if (badRecipientMsg) {
        if (plantNameInput) plantNameInput.focus();
        showToast(badRecipientMsg);
        return;
      }
      if (heroRecipientNameEl) {
        heroRecipientNameEl.textContent = recipient || 'you';
      }

      if (prefersReducedMotion) {
        if (plantPromptEl) plantPromptEl.remove();
        introComplete = true;
        introStarBurstDone = true;
        scenePhase = 'ready';
        if (heroOverlayEl && !heroRevealed) {
          heroRevealed = true;
          heroOverlayEl.classList.add('is-revealed');
        }
        return;
      }

      if (btnPlantTree) {
        const br = btnPlantTree.getBoundingClientRect();
        spawnIntroStarBurst(br.left + br.width * 0.5, br.top + br.height * 0.5);
      }
      samplePromptParticles(recipient);
      if (plantPromptEl) {
        plantPromptEl.classList.add('is-dissolved');
        plantPromptEl.style.pointerEvents = 'none';
        setTimeout(() => { if (plantPromptEl && plantPromptEl.parentNode) plantPromptEl.remove(); }, 260);
      }

      scenePhase = 'seeding';
      phaseElapsed = 0;
      groundRipples.length = 0;
    }

    if (btnPlantTree) {
      btnPlantTree.addEventListener('click', startPlantingSequence);
    }

    function spawnIntroStarBurst(sx, sy) {
      const theme = THEMES[currentThemeIdx];
      const count = 14;
      for (let i = 0; i < count; i++) {
        const ang = (i / count) * Math.PI * 2 + rand(-0.18, 0.18);
        const spd = rand(65, 165);
        const shp = (i % 2 === 0) ? 'spark' : 'star';
        const col = (i % 3 === 0) ? theme.starColor : theme.palette[i % theme.palette.length];
        burstEffects.push({
          x: sx,
          y: sy,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 24,
          gravity: 55,
          drag: 0.96,
          rot: rand(-0.4, 0.4),
          vrot: rand(-2.2, 2.2),
          swayAmp: 0,
          phase: rand(0, Math.PI * 2),
          sprite: getVectorBurstSprite(shp, col, theme.paper),
          life: 1.0,
          decay: rand(0.95, 1.35),
          size: rand(14, 22)
        });
      }
    }

    function spawnBurst(sx, sy) {
      const theme = THEMES[currentThemeIdx];
      const cfg = THEME_BURSTS[currentThemeIdx];

      if (cfg.mode === 'xmas') {
        // 🎄 风格1：简约手绘线条圣诞元素（礼物盒、铃铛、圣诞帽、拐杖糖、小树、星芒）
        const count = 15;
        for (let i = 0; i < count; i++) {
          const ang = (i / count) * Math.PI * 2 + rand(-0.22, 0.22);
          const spd = rand(85, 230);
          const shp = cfg.shapes[Math.floor(Math.random() * cfg.shapes.length)];
          const col = theme.palette[i % theme.palette.length];
          burstEffects.push({
            x: sx, y: sy,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 95,
            gravity: 260,
            drag: 0.99,
            rot: rand(-0.3, 0.3),
            vrot: rand(-2.8, 2.8),
            swayAmp: 0,
            phase: rand(0, Math.PI * 2),
            sprite: getVectorBurstSprite(shp, col, false),
            life: 1.0,
            decay: rand(0.68, 1.02),
            size: rand(22, 32)
          });
        }
      } else if (cfg.mode === 'formula') {
        // 📖 风格2：数理化公式从纸页间飘散绽放（简约钢笔手写墨水色）
        const inkPalette = ['#23201d', '#b8323e', '#1f6b48', '#274c77', '#9c5a14'];
        const count = 11;
        for (let i = 0; i < count; i++) {
          const ang = (i / count) * Math.PI * 2 + rand(-0.25, 0.25);
          const spd = rand(75, 195);
          const txt = cfg.items[Math.floor(Math.random() * cfg.items.length)];
          const col = inkPalette[i % inkPalette.length];
          burstEffects.push({
            x: sx, y: sy,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 45,

            drag: 0.96,
            rot: rand(-0.22, 0.22),

        const heartColors = ['#ff85b3', '#ffb3d1', '#ffe08a', '#ff5c93', '#ffd6e8', '#e0aaff'];
        const count = 16;
        for (let i = 0; i < count; i++) {
          const ang = rand(-Math.PI, 0) + rand(-0.4, 0.4);
          const spd = rand(50, 160);
          const shp = cfg.shapes[Math.floor(Math.random() * cfg.shapes.length)];
          const col = heartColors[i % heartColors.length];
          burstEffects.push({
            x: sx + rand(-10, 10), y: sy + rand(-10, 10),
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 55,
            gravity: -95,
            drag: 0.965,
            rot: rand(-0.28, 0.28),
            vrot: rand(-0.9, 0.9),
            swayAmp: rand(35, 72),
            phase: rand(0, Math.PI * 2),
            sprite: getVectorBurstSprite(shp, col, false),
            life: 1.0,
            decay: rand(0.55, 0.88),
            size: rand(20, 32)
          });
        }
      } else {
        // 🌌 风格4：极简几何线条冰晶雪花（六角树枝/六边形冰晶/星晶针，旋转飘落）
        const snowColors = ['#e0f7ff', '#67e8f9', '#a5b4fc', '#c084fc', '#ffffff', '#5eead4'];
        const count = 18;
        for (let i = 0; i < count; i++) {
          const ang = (i / count) * Math.PI * 2 + rand(-0.15, 0.15);
          const spd = rand(80, 215);
          const shp = cfg.shapes[Math.floor(Math.random() * cfg.shapes.length)];
          const col = snowColors[i % snowColors.length];
          burstEffects.push({
            x: sx, y: sy,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            gravity: 52,
            drag: 0.935,
            rot: rand(0, Math.PI * 2),
            vrot: rand(-4.2, 4.2),
            swayAmp: rand(15, 32),
            phase: rand(0, Math.PI * 2),
            sprite: getVectorBurstSprite(shp, col, false),

      for (const n of treeNodes) {
        if (n.type === 'kaomoji' && Math.random() < 0.35) {

    // =========================================================================
    // 3D 信封祝福贺卡弹窗 & 手写挂卡交互控制器（支持空间坐标弹出、3D 翻盖拆封、抽信换卡、轻盈退场）

    function fillCardContent(card, fromHangingCard) {
      currentOpenedCard = card;
      lastRandomCardId = card.id;
      const idx = allCards.findIndex((c) => c.id === card.id);
      const numStr = String(idx + 1).padStart(2, '0');
      const canDelete = Boolean(card.custom && (!isCloudEnabled || card.mine));

      cardTagPill.textContent = card.mine
        ? `我的手写贺卡 · No.${numStr}`
        : (card.custom
          ? `共享树来信 · No.${numStr}`
          : (fromHangingCard ? `树上挂卡 · No.${numStr}` : `随机盲盒 · No.${numStr}`));
      cardStyleLabel.textContent = CARD_STYLE_NAMES[card.style] || '圣诞祝福卡';
      envWaxSeal.textContent = WAX_SEAL_GLYPHS[card.style] || '★';
      cardKaomojiDisplay.textContent = card.kaomoji || '(=^•ω•^=) ♡';
      cardTitleDisplay.textContent = card.title || '圣诞快乐';
      cardBodyDisplay.textContent = card.message;
      cardSignDisplay.textContent = `—— ${card.sign || '匿名圣诞老人'}`;
      btnDeleteCard.style.display = canDelete ? 'inline-block' : 'none';
    }

    // 带空间发射起点 (originX, originY) 的 3D 信封弹出与拆封编排
    function openCardModal(card, fromHangingCard = false, originX = null, originY = null) {
      if (!card) return;
      clearModalTimers();
      fillCardContent(card, fromHangingCard);

      // 计算点击位置相对屏幕中心的偏移量（遵循 1/3 屏运动距离法则，防止跨屏飞跃失焦）
      const maxDx = Math.min(260, viewW * 0.28);
      const maxDy = Math.min(200, viewH * 0.28);
      const dx = originX !== null ? Math.max(-maxDx, Math.min(maxDx, originX - viewW * 0.5)) : 0;
      const dy = originY !== null ? Math.max(-maxDy, Math.min(maxDy, originY - viewH * 0.5)) : 28;
      const tilt = Math.max(-10, Math.min(10, dx * -0.032));

      envelopeShell.style.setProperty('--origin-x', `${dx.toFixed(1)}px`);
      envelopeShell.style.setProperty('--origin-y', `${dy.toFixed(1)}px`);
      envelopeShell.style.setProperty('--origin-rot', `${tilt.toFixed(1)}deg`);

      composeModalBackdrop.classList.remove('open', 'closing');
      cardModalBackdrop.classList.remove('closing');

      // 复位信封到合拢待发射状态
      envelopeShell.classList.remove('is-entering', 'is-opened', 'is-swapping');
      cardModalBackdrop.classList.add('open');
      void envelopeShell.offsetWidth; // 强制同步初始空间起点帧

      // Beat 1 (0ms): 信封从点击处弹簧飞出至画面中央
      requestAnimationFrame(() => {
        envelopeShell.classList.add('is-entering');
      });

      // Beat 2 (200ms): 到达落点后，火漆印章解封 -> 3D 翻盖向上折开 -> 祝福信纸抽出并错峰显现
      openFlapTimer = setTimeout(() => {
        envelopeShell.classList.add('is-opened');
      }, 200);
    }

    function pickRandomCard() {
      if (!allCards.length) return null;
      let pool = allCards;
      if (allCards.length > 1 && lastRandomCardId) {
        pool = allCards.filter((c) => c.id !== lastRandomCardId);
      }
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function openRandomCard(originX = null, originY = null) {
      const picked = pickRandomCard();
      if (picked) openCardModal(picked, false, originX, originY);
    }

    // 在信封已打开状态下点击「再抽一张」：信纸缩回袋中 -> 替换新信 -> 轻快滑出
    function swapToRandomCard() {
      const picked = pickRandomCard();
      if (!picked) return;
      clearTimeout(swapLetterTimer);
      envelopeShell.classList.add('is-swapping');
      swapLetterTimer = setTimeout(() => {
        fillCardContent(picked, false);

    // 轻盈退场（鼠标点击退场保留 190ms 柔和离场；键盘 Esc 则瞬间响应不拖沓）
    function closeAllModals(instant = false) {
      clearModalTimers();
      const anyOpen = cardModalBackdrop.classList.contains('open') || composeModalBackdrop.classList.contains('open');
      if (!anyOpen) return;

      if (instant) {
        cardModalBackdrop.classList.remove('open', 'closing');
        composeModalBackdrop.classList.remove('open', 'closing');
        envelopeShell.classList.remove('is-entering', 'is-opened', 'is-swapping');
        return;
      }

      if (cardModalBackdrop.classList.contains('open')) cardModalBackdrop.classList.add('closing');
      if (composeModalBackdrop.classList.contains('open')) composeModalBackdrop.classList.add('closing');

      closeModalTimer = setTimeout(() => {
        cardModalBackdrop.classList.remove('open', 'closing');
        composeModalBackdrop.classList.remove('open', 'closing');
        envelopeShell.classList.remove('is-entering', 'is-opened', 'is-swapping');

    // 点击圣诞树画布时的智能判定：
    // 1. 始终触发当前主题极简点击粒子
    // 2. 点到树上悬挂的具体贺卡 -> 信封从该挂卡 3D 位置弹出并拆开
    // 3. 点到圣诞树任意部位 -> 随机抽一张信封从点击点弹出并拆开
    // 4. 点到空白星空 -> 仅展示粒子特效，不弹弹窗
    function handleCanvasClick(sx, sy) {
      if (scenePhase !== 'ready') return;
      spawnBurst(sx, sy);

      // 优先从前景到背景检测是否点中了树上挂着的贺卡
      for (let i = renderQueue.length - 1; i >= 0; i--) {
        const item = renderQueue[i];
        if (item.node.type !== 'cardOrnament') continue;
        const hitR = Math.max(22, Math.min(44, 28 * item.scale * sizeMultiplier));
        const dist = Math.hypot(sx - item.sx, sy - item.sy);
        if (dist <= hitR) {
          item.node.bounce = 1.0;
          openCardModal(item.node.card, true, item.sx, item.sy);
          return;
        }
      }

      // 其次检测是否点中了圣诞树本体任意部位（点随机部位出随机信封贺卡）
      for (let i = renderQueue.length - 1; i >= 0; i--) {
        const item = renderQueue[i];
        const t = item.node.type;
        if (t !== 'kaomoji' && t !== 'topStar' && t !== 'trunkText') continue;
        const hitR = Math.max(28, Math.min(54, 38 * item.scale * sizeMultiplier));
        const dist = Math.hypot(sx - item.sx, sy - item.sy);
        if (dist <= hitR) {
          openRandomCard(sx, sy);
          return;
        }
      }
    }

    // 绑定弹窗与手写表单按钮

    // 提交手写贺卡并直接挂到当前面向观众的圣诞树正面！
